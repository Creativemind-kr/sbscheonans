// ── 업무 분석 탭 ──
let analysisPeriod = 'month';
const chartRegistry = {};

function destroyChart(id) {
    if (chartRegistry[id]) { chartRegistry[id].destroy(); delete chartRegistry[id]; }
}

function setAnalysisPeriod(period) {
    analysisPeriod = period;
    document.querySelectorAll('.af-btn').forEach(b => b.classList.toggle('active', b.dataset.period === period));
    renderAnalysisTab();
}

function renderAnalysisTab() {
    buildAnalysisTextSection();
    buildAnalysisCharts();
}

function getAnalysisPersonOrder() {
    const all = getAllAssignees();
    const ordered = memberOrder.filter(m => all.includes(m));
    const rest = all.filter(m => !memberOrder.includes(m));
    return [...ordered, ...rest];
}

function getMondayOfWeek(date) {
    const d = new Date(date);
    const day = d.getDay();
    d.setDate(d.getDate() - (day === 0 ? 6 : day - 1));
    d.setHours(0,0,0,0);
    return d;
}

function getWeekOfMonth(date) {
    const first = new Date(date.getFullYear(), date.getMonth(), 1);
    return Math.ceil((date.getDate() + first.getDay() - 1) / 7);
}

function buildAnalysisTextSection() {
    const now = new Date();
    const completed = tasks.filter(t => t.status === '완료' && t.doneAt);
    let periodLabel, periodTasks;

    if (analysisPeriod === 'day' || analysisPeriod === 'week') {
        const ws = getMondayOfWeek(now);
        const we = new Date(ws); we.setDate(ws.getDate() + 6); we.setHours(23,59,59,999);
        periodTasks = completed.filter(t => t.doneAt >= ws.getTime() && t.doneAt <= we.getTime());
        const wn = getWeekOfMonth(now);
        periodLabel = analysisPeriod === 'day'
            ? `${now.getFullYear()}년 ${now.getMonth()+1}월 ${wn}주차 일별 현황`
            : `${now.getFullYear()}년 ${now.getMonth()+1}월 ${wn}주차 업무 결산`;
    } else if (analysisPeriod === 'month') {
        periodTasks = completed.filter(t => {
            const d = new Date(t.doneAt);
            return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
        });
        periodLabel = `${now.getFullYear()}년 ${now.getMonth()+1}월 업무 결산`;
    } else {
        periodTasks = completed.filter(t => new Date(t.doneAt).getFullYear() === now.getFullYear());
        periodLabel = `${now.getFullYear()}년 연간 업무 결산`;
    }

    const persons = getAnalysisPersonOrder();
    const allNonRoutine = periodTasks.filter(t => !t.isRoutine);
    const totalNonRoutine = allNonRoutine.length;

    let rows = '';

    // 상시업무 행
    const routineDone = periodTasks.filter(t => t.isRoutine);
    rows += buildAnalysisRow('🔄 상시업무', `${routineDone.length}건 처리`,
        routineDone.length > 0 ? `<span class="an-tag an-warn">완료 ${routineDone.length}건</span>` : '—');

    // 담당자별 행
    persons.forEach(person => {
        const pt = allNonRoutine.filter(t => t.assignee === person);
        const tags = [];

        if (analysisPeriod === 'month' && pt.length > 0) {
            const weeks = [0,0,0,0,0];
            pt.forEach(t => { const w = Math.min(Math.floor((new Date(t.doneAt).getDate()-1)/7),4); weeks[w]++; });
            const peak = weeks.indexOf(Math.max(...weeks));
            if (Math.max(...weeks) > 1) tags.push(`<span class="an-tag an-warn">${peak+1}주차 집중</span>`);
        }
        if (analysisPeriod === 'year' && pt.length > 0) {
            const months = new Array(12).fill(0);
            pt.forEach(t => { months[new Date(t.doneAt).getMonth()]++; });
            const peakM = months.indexOf(Math.max(...months));
            if (Math.max(...months) > 0) tags.push(`<span class="an-tag an-warn">${peakM+1}월 최다</span>`);
        }
        const pRoutine = periodTasks.filter(t => t.isRoutine && t.assignee === person);
        if (pRoutine.length > 0 && pt.length > 0 && pRoutine.length/(pRoutine.length+pt.length) > 0.5)
            tags.push(`<span class="an-tag an-alert">상시업무 과중</span>`);
        if (totalNonRoutine > 0 && persons.length > 1 && pt.length/totalNonRoutine > 0.45)
            tags.push(`<span class="an-tag an-alert">업무 분배 필요</span>`);
        if (pt.length === 0 && analysisPeriod !== 'week' && analysisPeriod !== 'day')
            tags.push(`<span class="an-tag an-warn">완료 없음</span>`);
        if (pt.length > 0 && tags.length === 0)
            tags.push(`<span class="an-tag an-good">정상</span>`);

        rows += buildAnalysisRow(`👤 ${esc(person)}`, `${pt.length}건 처리`, tags.join('') || '—');
    });

    document.getElementById('analysis-text-section').innerHTML = `
        <div class="analysis-text-card">
            <div class="analysis-text-title">📊 ${periodLabel}</div>
            ${rows}
        </div>`;
}

function buildAnalysisRow(name, count, notes) {
    return `<div class="analysis-row">
        <div class="analysis-person-name">${name}</div>
        <div class="analysis-count">${count}</div>
        <div class="analysis-notes">${notes}</div>
    </div>`;
}

function buildAnalysisCharts() {
    Object.keys(chartRegistry).forEach(id => destroyChart(id));
    const persons = getAnalysisPersonOrder();
    const allPersons = ['상시업무', ...persons];
    const colors = ['#8B5CF6','#4F46E5','#0EA5E9','#10B981','#F59E0B','#EF4444','#EC4899','#F97316'];

    let html = '';
    allPersons.forEach((person, i) => {
        html += `<div class="analysis-chart-card">
            <div class="analysis-chart-title">${person === '상시업무' ? '🔄' : '👤'} ${esc(person)}</div>
            <div class="analysis-chart-wrap"><canvas id="chart-p${i}"></canvas></div>
        </div>`;
    });
    document.getElementById('analysis-charts-section').innerHTML = html;

    allPersons.forEach((person, i) => {
        const chartId = `chart-p${i}`;
        const { labels, data, taskMap } = getChartPeriodData(person);
        const color = colors[i % colors.length];
        const canvas = document.getElementById(chartId);
        if (!canvas) return;
        chartRegistry[chartId] = new Chart(canvas.getContext('2d'), {
            type: 'bar',
            data: {
                labels,
                datasets: [{ label: person, data, backgroundColor: color + 'BB', borderColor: color, borderWidth: 1, borderRadius: 4 }]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => `${ctx.raw}건` } } },
                scales: { y: { beginAtZero: true, ticks: { stepSize: 1, precision: 0 } } },
                onClick: (e, els) => {
                    if (!els.length) return;
                    const idx = els[0].index;
                    showAnalysisPeriodTasks(`${esc(person)} — ${labels[idx]}`, taskMap[idx] || []);
                }
            }
        });
    });
}

function getChartPeriodData(person) {
    const isRoutine = person === '상시업무';
    const completed = tasks.filter(t => t.status === '완료' && t.doneAt);
    const base = isRoutine
        ? completed.filter(t => t.isRoutine)
        : completed.filter(t => !t.isRoutine && t.assignee === person);

    const now = new Date();
    const labels = [], data = [], taskMap = [];

    if (analysisPeriod === 'day') {
        const year = now.getFullYear(), month = now.getMonth();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const dayNames = ['일','월','화','수','목','금','토'];
        let weekNum = 0, prevMondayKey = null;
        for (let d = 1; d <= daysInMonth; d++) {
            const date = new Date(year, month, d);
            const dow = date.getDay();
            if (dow === 0 || dow === 6) continue;
            const monday = getMondayOfWeek(date);
            const mondayKey = monday.getTime();
            const isNewWeek = mondayKey !== prevMondayKey;
            if (isNewWeek) { weekNum++; prevMondayKey = mondayKey; }
            const dd = String(d).padStart(2, '0');
            const label = isNewWeek
                ? [`${weekNum}주차`, `${dd}(${dayNames[dow]})`]
                : `${dd}(${dayNames[dow]})`;
            const dayStart = new Date(year, month, d).getTime();
            const dayEnd = new Date(year, month, d, 23, 59, 59, 999).getTime();
            const dt = base.filter(t => t.doneAt >= dayStart && t.doneAt <= dayEnd);
            labels.push(label); data.push(dt.length); taskMap.push(dt);
        }
    } else if (analysisPeriod === 'week') {
        for (let w = 11; w >= 0; w--) {
            const ws = getMondayOfWeek(new Date(now.getTime() - w * 7 * 86400000));
            const we = new Date(ws); we.setDate(ws.getDate() + 6); we.setHours(23,59,59,999);
            const wt = base.filter(t => t.doneAt >= ws.getTime() && t.doneAt <= we.getTime());
            const wn = getWeekOfMonth(ws);
            labels.push(`${ws.getMonth()+1}월 ${wn}주차`);
            data.push(wt.length); taskMap.push(wt);
        }
    } else if (analysisPeriod === 'month') {
        for (let m = 0; m <= now.getMonth(); m++) {
            const d = new Date(now.getFullYear(), m, 1);
            const mt = base.filter(t => { const td = new Date(t.doneAt); return td.getFullYear()===d.getFullYear()&&td.getMonth()===d.getMonth(); });
            labels.push(`${d.getMonth()+1}월`);
            data.push(mt.length); taskMap.push(mt);
        }
    } else {
        const years = [...new Set(base.map(t => new Date(t.doneAt).getFullYear()))];
        if (!years.includes(now.getFullYear())) years.push(now.getFullYear());
        if (years.length < 2) years.unshift(now.getFullYear() - 1);
        years.sort().forEach(y => {
            const yt = base.filter(t => new Date(t.doneAt).getFullYear() === y);
            labels.push(`${y}년`); data.push(yt.length); taskMap.push(yt);
        });
    }
    return { labels, data, taskMap };
}

function showAnalysisPeriodTasks(title, list) {
    document.getElementById('analysis-period-modal-h').textContent = `${title} (${list.length}건)`;
    document.getElementById('analysis-period-modal-list').innerHTML = list.length
        ? list.map(t => `<div class="reminder-item">
            <div><div class="ri-title">${esc(t.title)}</div>${t.assignee?`<div class="ri-sub">👤 ${esc(t.assignee)}</div>`:''}</div>
            <span class="badge" style="background:#D1FAE5;color:#065F46">✓ 완료</span>
          </div>`).join('')
        : `<div class="empty-state"><div class="ei">📭</div><p>해당 기간 완료 업무 없음</p></div>`;
    document.getElementById('analysis-period-overlay').classList.add('show');
}
function closeAnalysisPeriodModal() { document.getElementById('analysis-period-overlay').classList.remove('show'); }

// ── 유틸 ──
function esc(s) { const d = document.createElement('div'); d.textContent = s||''; return d.innerHTML; }
let _tt;
function showToast(msg, ms=2500) {
    const el = document.getElementById('toast');
    el.textContent = msg; el.classList.add('show');
    clearTimeout(_tt); _tt = setTimeout(() => el.classList.remove('show'), ms);
}

// ── 진입 ──
window.addEventListener('load', () => {
    if (sessionStorage.getItem('auth') === '1') {
        document.getElementById('pw-screen').style.display = 'none';
        document.getElementById('app').style.display = 'flex';
        bootApp();
    } else {
        document.getElementById('pw-input').focus();
    }
});
</script>
