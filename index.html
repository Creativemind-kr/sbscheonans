<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>팀 업무 리마인더</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>">
    <!-- <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.0/kakao.min.js"></script> -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --primary: #4F46E5; --primary-h: #4338CA;
            --bg: #F1F5F9; --card: #fff; --border: #E2E8F0;
            --text: #1E293B; --muted: #64748B;
            --red: #EF4444; --amber: #F59E0B; --green: #10B981;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

        /* ── 비밀번호 ── */
        #pw-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%); }
        .pw-card { background: #fff; padding: 44px 40px; border-radius: 20px; box-shadow: 0 24px 64px rgba(0,0,0,.22); width: 340px; text-align: center; }
        .pw-card .logo { font-size: 2.2rem; margin-bottom: 12px; }
        .pw-card h2 { font-size: 1.3rem; font-weight: 700; margin-bottom: 6px; }
        .pw-card p { color: var(--muted); font-size: .875rem; margin-bottom: 24px; }
        .pw-card input { width: 100%; padding: 12px 16px; border: 2px solid var(--border); border-radius: 10px; font-size: 1rem; outline: none; margin-bottom: 10px; transition: border-color .2s; }
        .pw-card input:focus { border-color: var(--primary); }
        .pw-card .pw-btn { width: 100%; padding: 12px; background: var(--primary); color: #fff; border: none; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; }
        .pw-card .pw-btn:hover { background: var(--primary-h); }
        .pw-err { color: var(--red); font-size: .82rem; margin-top: 8px; min-height: 18px; }

        /* ── 앱 ── */
        #app { display: none; flex-direction: column; min-height: 100vh; }

        /* 헤더 */
        .header { background: #fff; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 20; }
        .header-top { padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; }
        .header-title { font-size: 1.1rem; font-weight: 700; }
        .header-date { font-size: .78rem; color: var(--muted); margin-top: 2px; }
        .header-actions { display: flex; gap: 8px; align-items: center; }
        .tabs { display: flex; padding: 0 20px; }
        .tab-btn { padding: 10px 18px; background: none; border: none; font-size: .875rem; font-weight: 500; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all .15s; }
        .tab-btn:hover { color: var(--text); }
        .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }

        /* 배너 */
        .reminder-banner { display: none; background: #FFFBEB; border-bottom: 2px solid var(--amber); padding: 11px 24px; align-items: center; gap: 12px; }
        .reminder-banner.show { display: flex; }
        .banner-text { flex: 1; font-size: .875rem; color: #92400E; }
        .banner-actions { display: flex; gap: 8px; flex-shrink: 0; }

        /* 마감 임박 배너 */
        .deadline-banner { display: none; background: #FEF2F2; border-bottom: 2px solid var(--red); padding: 10px 24px; flex-direction: column; gap: 8px; }
        .deadline-banner.show { display: flex; }
        .deadline-banner-top { display: flex; align-items: center; gap: 12px; }
        .deadline-banner .banner-text { color: #991B1B; flex: 1; }
        .deadline-groups { display: flex; flex-wrap: wrap; gap: 10px; padding-left: 24px; }
        .deadline-group { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
        .deadline-group-name { font-size: .78rem; font-weight: 700; color: #991B1B; white-space: nowrap; }
        .deadline-task-chip { display: inline-flex; align-items: center; gap: 2px; padding: 2px 7px; border-radius: 4px; font-size: .74rem; font-weight: 500; }
        .deadline-task-chip.over     { background: #FEE2E2; color: #DC2626; }
        .deadline-task-chip.today    { background: #FEE2E2; color: #DC2626; }
        .deadline-task-chip.tomorrow { background: #FEF3C7; color: #D97706; }

        /* 버튼 */
        .btn { padding: 8px 14px; border-radius: 8px; border: none; font-size: .85rem; font-weight: 500; cursor: pointer; transition: all .15s; white-space: nowrap; }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-h); }
        .btn-secondary { background: #fff; color: var(--text); border: 1px solid var(--border); }
        .btn-secondary:hover { background: #F8FAFC; }
        .btn-kakao { background: #FEE500; color: #3C1E1E; font-weight: 700; }
        .btn-kakao:hover { background: #FFD600; }
        .btn-danger { background: #FEE2E2; color: var(--red); }
        .btn-danger:hover { background: #FECACA; }
        .btn-sm { padding: 5px 10px; font-size: .8rem; }
        .badge { padding: 3px 9px; border-radius: 20px; font-size: .75rem; font-weight: 600; white-space: nowrap; }
        .badge-red { background: #FEE2E2; color: #DC2626; }
        .badge-amber { background: #FEF3C7; color: #D97706; }

        /* 탭 패널 */
        .tab-pane { display: none; flex: 1; flex-direction: column; }
        .tab-pane.active { display: flex; }

        /* ── 통계 위젯 ── */
        .stats-widget { display: flex; gap: 10px; padding: 16px 24px 0; flex-wrap: wrap; }
        .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; flex: 1; min-width: 80px; text-align: center; }
        .stat-num { font-size: 1.4rem; font-weight: 800; line-height: 1.2; }
        .stat-num.red { color: var(--red); }
        .stat-num.amber { color: var(--amber); }
        .stat-num.green { color: var(--green); }
        .stat-num.primary { color: var(--primary); }
        .stat-label { font-size: .7rem; color: var(--muted); margin-top: 2px; }
        .stat-bar-wrap { padding: 8px 24px 0; }
        .stat-bar-track { background: #E2E8F0; border-radius: 99px; height: 6px; overflow: hidden; }
        .stat-bar-fill { background: var(--green); border-radius: 99px; height: 100%; transition: width .4s; }
        .stat-bar-label { font-size: .73rem; color: var(--muted); margin-top: 4px; text-align: right; }

        /* ── 상시 업무 섹션 ── */
        .routine-section { margin: 14px 24px 0; background: var(--card); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
        .routine-head { padding: 11px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; background: #FAFAFA; }
        .routine-head-left { display: flex; align-items: center; gap: 8px; }
        .routine-head-title { font-weight: 700; font-size: .88rem; }
        .routine-count { background: #F1F5F9; color: var(--muted); padding: 2px 9px; border-radius: 20px; font-size: .76rem; font-weight: 700; }
        .routine-body { padding: 10px 12px; display: flex; flex-wrap: wrap; gap: 8px; min-height: 46px; align-items: flex-start; }
        .routine-item { display: inline-flex; align-items: center; gap: 6px; background: #F8FAFC; border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; transition: all .15s; cursor: grab; }
        .routine-item:hover { border-color: var(--primary); }
        .routine-item.dragging { opacity: .35; border-style: dashed; cursor: grabbing; }
        .routine-body.drag-over-routine { background: #EEF2FF; border-radius: 8px; }
        .routine-item.done { background: #F0FDF4; border-color: #86EFAC; }
        .routine-check { width: 15px; height: 15px; border-radius: 3px; border: 2px solid #CBD5E1; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: .65rem; transition: all .15s; color: transparent; cursor: pointer; }
        .routine-item.done .routine-check { background: var(--green); border-color: var(--green); color: #fff; }
        .routine-title { font-size: .82rem; font-weight: 500; cursor: pointer; }
        .routine-title:hover { color: var(--primary); text-decoration: underline; }
        .routine-assignee { font-size: .7rem; color: var(--muted); }
        .routine-edit-btn { background: none; border: none; font-size: .72rem; color: #CBD5E1; cursor: pointer; padding: 2px 4px; border-radius: 4px; flex-shrink: 0; transition: color .15s; }
        .routine-edit-btn:hover { color: var(--primary); }
        .routine-empty { color: var(--muted); font-size: .82rem; padding: 4px 2px; }

        /* ── 보드 탭 ── */
        .board-wrap { padding: 14px 24px 0; }
        .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
        @media (max-width: 760px) { .board { grid-template-columns: 1fr; } }
        .col { background: var(--card); border-radius: 14px; border: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
        .col-head { padding: 13px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
        .col-title { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: .9rem; }
        .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
        .dot-red { background: var(--red); } .dot-amber { background: var(--amber); } .dot-green { background: var(--green); }
        .col-count { background: #F1F5F9; color: var(--muted); padding: 2px 9px; border-radius: 20px; font-size: .78rem; font-weight: 700; }
        .col-body { padding: 12px; flex: 1; min-height: 140px; overflow-y: auto; max-height: 50vh; transition: background .15s; }
        .col-body.drag-over { background: #EEF2FF; }
        .task-card { background: #F8FAFC; border: 1px solid var(--border); border-radius: 9px; padding: 11px 12px; margin-bottom: 8px; cursor: pointer; transition: border-color .2s, box-shadow .2s; }
        .task-card:last-child { margin-bottom: 0; }
        .task-card:hover { border-color: var(--primary); box-shadow: 0 2px 10px rgba(79,70,229,.1); }
        .task-card.is-done { opacity: .6; }
        .task-card.dragging { opacity: .3; border-style: dashed; cursor: grabbing; }
        .card-title { font-weight: 600; font-size: .88rem; margin-bottom: 3px; word-break: break-all; }
        .card-badges { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 4px; }
        .card-sub { font-size: .78rem; color: var(--muted); margin-bottom: 4px; word-break: break-all;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .status-btns { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 6px; }
        .s-btn { padding: 3px 8px; border-radius: 5px; border: 1px solid var(--border); font-size: .75rem; cursor: pointer; background: #fff; transition: all .12s; }
        .s-btn:hover { background: #EFF6FF; border-color: var(--primary); color: var(--primary); }
        .card-date { font-size: .72rem; color: #CBD5E1; text-align: right; }
        .empty-state { text-align: center; padding: 28px 16px; color: var(--muted); }
        .empty-state .ei { font-size: 1.8rem; margin-bottom: 8px; }
        .empty-state p { font-size: .83rem; }

        /* 우선순위 뱃지 */
        .priority-badge { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: .68rem; font-weight: 700; }
        .prio-high { background: #FEE2E2; color: #DC2626; }
        .prio-low  { background: #F0FDF4; color: #16A34A; }

        /* 마감일 뱃지 */
        .due-badge { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: .68rem; font-weight: 600; }
        .due-over     { background: #FEE2E2; color: #DC2626; }
        .due-today    { background: #FEE2E2; color: #DC2626; }
        .due-tomorrow { background: #FEF3C7; color: #D97706; }
        .due-normal   { background: #F1F5F9; color: var(--muted); }

        /* ── 담당자 섹션 (보드 하단) ── */
        .person-section { margin: 20px 24px 24px; }
        .person-section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid var(--border); flex-wrap: wrap; gap: 8px; }
        .person-section-title { font-size: .95rem; font-weight: 700; display: flex; align-items: center; gap: 6px; }
        .person-add-row { display: flex; gap: 8px; align-items: center; }
        .person-add-row input { padding: 7px 11px; border: 1.5px solid var(--border); border-radius: 8px; font-size: .85rem; outline: none; transition: border-color .2s; font-family: inherit; width: 150px; }
        .person-add-row input:focus { border-color: var(--primary); }
        .person-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
        .person-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
        .person-card-head { padding: 11px 14px; background: #F8FAFC; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
        .p-avatar-wrap { display: flex; align-items: center; gap: 9px; }
        .p-avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: .88rem; color: #fff; flex-shrink: 0; }
        .p-name { font-weight: 700; font-size: .88rem; }
        .p-sub { font-size: .72rem; color: var(--muted); }
        .p-remove { background: none; border: none; cursor: pointer; color: #CBD5E1; font-size: .85rem; padding: 3px; border-radius: 4px; transition: color .15s; }
        .p-remove:hover { color: var(--red); }
        .person-card-body { padding: 8px 10px; }
        .p-task-item { padding: 7px 9px; background: #F8FAFC; border: 1px solid var(--border); border-radius: 7px; margin-bottom: 5px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 6px; transition: border-color .15s; }
        .p-task-item:last-child { margin-bottom: 0; }
        .p-task-item:hover { border-color: var(--primary); }
        .p-task-title { font-size: .82rem; font-weight: 500; flex: 1; }
        .p-empty { text-align: center; padding: 16px; color: var(--muted); font-size: .8rem; }

        /* ── 완료 캘린더 탭 ── */
        .cal-layout { flex: 1; display: grid; grid-template-columns: 280px 1fr; gap: 0; overflow: hidden; }
        @media (max-width: 900px) { .cal-layout { grid-template-columns: 1fr; grid-template-rows: auto 1fr; } }
        .cal-left { border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; background: #fff; }
        .cal-left-head { padding: 16px; border-bottom: 1px solid var(--border); font-weight: 700; font-size: .9rem; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
        .cal-left-body { flex: 1; overflow-y: auto; padding: 12px; }
        .cal-status-group { margin-bottom: 14px; }
        .cal-status-label { display: flex; align-items: center; gap: 6px; font-size: .8rem; font-weight: 700; color: var(--muted); margin-bottom: 6px; padding: 0 2px; }
        .cal-task-li { padding: 8px 10px; background: #F8FAFC; border: 1px solid var(--border); border-radius: 7px; margin-bottom: 5px; cursor: pointer; transition: border-color .15s; }
        .cal-task-li:last-child { margin-bottom: 0; }
        .cal-task-li:hover { border-color: var(--primary); }
        .cal-task-li-title { font-size: .83rem; font-weight: 500; }
        .cal-task-li-sub { font-size: .75rem; color: var(--muted); margin-top: 2px; }
        .cal-right { display: flex; flex-direction: column; overflow: hidden; background: var(--bg); }
        .cal-nav { display: flex; align-items: center; justify-content: center; gap: 20px; padding: 16px; border-bottom: 1px solid var(--border); background: #fff; flex-shrink: 0; }
        .cal-nav-btn { background: #fff; border: 1px solid var(--border); border-radius: 8px; width: 32px; height: 32px; cursor: pointer; font-size: 1rem; color: var(--text); transition: background .15s; }
        .cal-nav-btn:hover { background: #F1F5F9; }
        .cal-month { font-weight: 700; font-size: 1rem; }
        .cal-body { flex: 1; overflow-y: auto; padding: 16px; }
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
        .cal-dow { text-align: center; padding: 6px 2px; font-size: .75rem; font-weight: 700; color: var(--muted); }
        .cal-cell { background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 6px; min-height: 72px; }
        .cal-cell.empty { background: transparent; border-color: transparent; }
        .cal-cell.is-today { border-color: var(--primary); background: #EEF2FF; }
        .cal-cell.has-done { background: #F0FDF4; border-color: var(--green); cursor: pointer; }
        .cal-cell.has-done:hover { background: #DCFCE7; box-shadow: 0 2px 8px rgba(16,185,129,.15); }
        .cal-day-num { font-size: .75rem; font-weight: 600; color: var(--muted); margin-bottom: 3px; }
        .cal-cell.is-today .cal-day-num { color: var(--primary); }
        .cal-dots { display: flex; flex-direction: column; gap: 2px; }
        .cal-dot-item { background: #D1FAE5; color: #065F46; font-size: .66rem; padding: 2px 4px; border-radius: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }

        /* ── 완료 업무 탭 ── */
        .done-wrap { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .done-filter { background: #fff; border-bottom: 1px solid var(--border); padding: 12px 24px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; flex-shrink: 0; }
        .done-filter select { padding: 7px 10px; border: 1.5px solid var(--border); border-radius: 8px; font-size: .85rem; outline: none; font-family: inherit; color: var(--text); background: #fff; cursor: pointer; transition: border-color .2s; }
        .done-filter select:focus { border-color: var(--primary); }
        .done-filter input[type=text] { padding: 7px 11px; border: 1.5px solid var(--border); border-radius: 8px; font-size: .85rem; outline: none; font-family: inherit; color: var(--text); background: #fff; flex: 1; min-width: 140px; max-width: 240px; transition: border-color .2s; }
        .done-filter input[type=text]:focus { border-color: var(--primary); }
        .done-count { font-size: .82rem; color: var(--muted); margin-left: auto; white-space: nowrap; }
        .done-list { flex: 1; overflow-y: auto; padding: 20px 24px; }
        .done-date-group { margin-bottom: 22px; }
        .done-date-header { font-size: .82rem; font-weight: 700; color: var(--muted); margin-bottom: 8px; padding-bottom: 7px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; }
        .done-item { background: var(--card); border: 1px solid var(--border); border-radius: 9px; padding: 12px 14px; margin-bottom: 7px; cursor: pointer; transition: border-color .2s, box-shadow .2s; display: flex; align-items: center; gap: 12px; }
        .done-item:last-child { margin-bottom: 0; }
        .done-item:hover { border-color: var(--primary); box-shadow: 0 2px 8px rgba(79,70,229,.08); }
        .done-item-info { flex: 1; min-width: 0; }
        .done-item-title { font-weight: 600; font-size: .9rem; margin-bottom: 2px; }
        .done-item-sub { font-size: .78rem; color: var(--muted); margin-top: 2px; }

        /* ── 참고 링크 섹션 ── */
        .links-section { margin: 0 24px 28px; }
        .links-section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid var(--border); flex-wrap: wrap; gap: 8px; }
        .links-section-title { font-size: .95rem; font-weight: 700; display: flex; align-items: center; gap: 6px; }
        .links-grid { display: flex; flex-direction: column; gap: 7px; }
        .link-item { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--border); border-radius: 9px; padding: 10px 14px; transition: border-color .2s, box-shadow .2s; }
        .link-item:hover { border-color: var(--primary); box-shadow: 0 2px 8px rgba(79,70,229,.08); }
        .link-info { flex: 1; min-width: 0; }
        .link-title { font-weight: 600; font-size: .88rem; }
        .link-url { font-size: .73rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
        .link-actions { display: flex; gap: 6px; flex-shrink: 0; align-items: center; }
        .link-open { padding: 5px 11px; border-radius: 7px; border: 1px solid var(--border); background: #fff; font-size: .8rem; cursor: pointer; color: var(--primary); font-weight: 600; transition: background .15s; }
        .link-open:hover { background: #EEF2FF; border-color: var(--primary); }
        .link-del { background: none; border: none; cursor: pointer; color: #CBD5E1; font-size: .85rem; padding: 4px; border-radius: 4px; transition: color .15s; line-height: 1; }
        .link-del:hover { color: var(--red); }

        /* 설정 드롭다운 */
        .settings-menu { position: absolute; right: 24px; top: 56px; background: #fff; border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.12); overflow: hidden; z-index: 30; min-width: 150px; display: none; }
        .settings-menu.open { display: block; }
        .settings-menu button { width: 100%; padding: 11px 16px; text-align: left; background: none; border: none; font-size: .875rem; cursor: pointer; color: var(--text); }
        .settings-menu button:hover { background: #F8FAFC; }
        .settings-menu button.danger { color: var(--red); }

        /* 모달 */
        .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
        .overlay.show { display: flex; }
        .modal { background: #fff; border-radius: 16px; padding: 28px; width: 100%; max-width: 460px; max-height: 90vh; overflow-y: auto; box-shadow: 0 24px 64px rgba(0,0,0,.18); }
        .modal h2 { font-size: 1.1rem; font-weight: 700; margin-bottom: 20px; }
        .form-row { margin-bottom: 14px; }
        .form-row label { display: block; font-size: .83rem; font-weight: 600; margin-bottom: 5px; }
        .form-row input, .form-row textarea, .form-row select { width: 100%; padding: 10px 13px; border: 1.5px solid var(--border); border-radius: 8px; font-size: .9rem; outline: none; transition: border-color .2s; font-family: inherit; color: var(--text); background: #fff; }
        .form-row input:focus, .form-row textarea:focus, .form-row select:focus { border-color: var(--primary); }
        .form-row textarea { min-height: 70px; resize: vertical; }
        .form-row-inline { display: flex; gap: 10px; margin-bottom: 14px; }
        .form-row-inline > .form-row { flex: 1; margin-bottom: 0; }
        .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border); }
        .reminder-list { margin: 12px 0; }
        .reminder-item { padding: 10px 13px; background: #F8FAFC; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .ri-title { font-weight: 600; font-size: .875rem; }
        .ri-sub { font-size: .78rem; color: var(--muted); }
        .checkbox-row { display: flex; align-items: center; gap: 8px; padding: 6px 0 10px; }
        .checkbox-row input[type=checkbox] { width: 16px; height: 16px; cursor: pointer; accent-color: var(--primary); flex-shrink: 0; }
        .checkbox-row label { font-size: .88rem; font-weight: 500; cursor: pointer; }

        /* Toast */
        .toast { position: fixed; bottom: 24px; right: 24px; background: #1E293B; color: #fff; padding: 11px 18px; border-radius: 9px; font-size: .85rem; z-index: 200; opacity: 0; transform: translateY(8px); transition: all .25s; pointer-events: none; }
        .toast.show { opacity: 1; transform: translateY(0); }

        /* ── 파일 첨부 ── */
        .attach-section { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); margin-bottom: 4px; }
        .attach-section-title { font-size: .83rem; font-weight: 700; margin-bottom: 8px; }
        .attach-btn-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
        .attach-label { display: inline-flex; align-items: center; gap: 5px; padding: 5px 10px; border-radius: 8px; border: 1px solid var(--border); background: #fff; font-size: .8rem; font-weight: 500; cursor: pointer; transition: all .15s; }
        .attach-label:hover { background: #EEF2FF; border-color: var(--primary); color: var(--primary); }
        .upload-status { font-size: .78rem; color: var(--muted); }
        .attach-list { display: flex; flex-direction: column; gap: 8px; }
        .attach-item { display: flex; align-items: center; gap: 8px; background: #F8FAFC; border: 1px solid var(--border); border-radius: 7px; padding: 7px 10px; }
        .attach-img-card { flex-direction: column; align-items: stretch; padding: 0; overflow: hidden; }
        .attach-img-preview { width: 100%; max-height: 240px; object-fit: contain; background: #1E293B; border-radius: 6px 6px 0 0; display: block; cursor: pointer; }
        .attach-item-foot { display: flex; align-items: center; justify-content: space-between; padding: 7px 10px; gap: 6px; }
        .attach-icon { width: 36px; height: 36px; background: #EEF2FF; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; flex-shrink: 0; }
        .attach-info { flex: 1; min-width: 0; }
        .attach-name { font-size: .82rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .attach-size { font-size: .7rem; color: var(--muted); margin-top: 1px; }
        .attach-actions { display: flex; gap: 4px; flex-shrink: 0; }
        .attach-dl { background: none; border: none; cursor: pointer; color: #94A3B8; font-size: .85rem; padding: 3px 5px; border-radius: 4px; transition: color .15s; line-height: 1; }
        .attach-dl:hover { color: var(--primary); }
        .attach-del { background: none; border: none; cursor: pointer; color: #CBD5E1; font-size: .85rem; padding: 3px 5px; border-radius: 4px; flex-shrink: 0; transition: color .15s; line-height: 1; }
        .attach-del:hover { color: var(--red); }

        /* ── 댓글 ── */
        .comment-section { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }
        .comment-section-title { font-size: .83rem; font-weight: 700; margin-bottom: 10px; }
        .comment-list { margin-bottom: 10px; max-height: 180px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
        .comment-item { background: #F8FAFC; border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; }
        .comment-item-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 3px; }
        .comment-author { font-size: .75rem; font-weight: 700; color: var(--primary); }
        .comment-time { font-size: .7rem; color: var(--muted); }
        .comment-text { font-size: .84rem; white-space: pre-wrap; word-break: break-all; }
        .comment-input-row { display: flex; gap: 6px; }
        .comment-input-row input { padding: 8px 10px; border: 1.5px solid var(--border); border-radius: 7px; font-size: .85rem; font-family: inherit; outline: none; transition: border-color .2s; }
        .comment-input-row input:focus { border-color: var(--primary); }
        .comment-author-input { width: 86px; flex-shrink: 0; }
        .comment-text-input { flex: 1; min-width: 0; }
        .comment-empty { color: var(--muted); font-size: .8rem; text-align: center; padding: 8px 0; }

        /* ── 활동 피드 탭 ── */
        .feed-wrap { flex: 1; overflow-y: auto; padding: 20px 24px; }
        .feed-item { display: flex; gap: 10px; align-items: flex-start; padding: 11px 0; border-bottom: 1px solid var(--border); }
        .feed-item:last-child { border-bottom: none; }
        .feed-icon { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: .85rem; flex-shrink: 0; }
        .feed-body { flex: 1; min-width: 0; }
        .feed-text { font-size: .85rem; line-height: 1.5; }
        .feed-time { font-size: .72rem; color: var(--muted); margin-top: 2px; }

        /* 피드 탭 (오른쪽 작은 탭) */
        .tab-btn-feed { margin-left: auto; font-size: .78rem; padding: 7px 12px; color: var(--muted); border: 1px solid var(--border); border-radius: 6px 6px 0 0; margin-bottom: -1px; background: none; cursor: pointer; transition: all .15s; white-space: nowrap; }
        .tab-btn-feed:hover { color: var(--text); border-color: #94A3B8; }
        .tab-btn-feed.active { color: var(--primary); border-color: var(--primary); background: #EEF2FF; }

        /* 완료 칸 더보기 버튼 */
        .more-btn { width: 100%; padding: 7px; background: #F8FAFC; border: 1.5px dashed #CBD5E1; border-radius: 7px; cursor: pointer; font-size: .8rem; color: var(--muted); margin-top: 4px; transition: all .15s; }
        .more-btn:hover { background: #EEF2FF; color: var(--primary); border-color: var(--primary); }

        /* 담당자 카드 드래그 */
        .person-card { transition: opacity .2s; cursor: grab; }
        .person-card:active { cursor: grabbing; }
        .person-card.dragging { opacity: .35; }
        .person-grid.drag-over-person { background: #EEF2FF; border-radius: 12px; outline: 2px dashed var(--primary); }

        /* ── 업무 분석 탭 ── */
        .analysis-wrap { padding: 16px 24px 32px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 16px; }
        .analysis-filter { display: flex; gap: 6px; }
        .af-btn { padding: 7px 18px; border-radius: 20px; border: 1.5px solid var(--border); background: #fff; font-size: .85rem; font-weight: 500; cursor: pointer; color: var(--muted); transition: all .15s; }
        .af-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
        .af-btn:hover:not(.active) { border-color: var(--primary); color: var(--primary); }
        .analysis-text-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px 20px; }
        .analysis-text-title { font-size: .95rem; font-weight: 700; margin-bottom: 14px; }
        .analysis-row { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid #F1F5F9; }
        .analysis-row:last-child { border-bottom: none; }
        .analysis-person-name { font-weight: 700; font-size: .83rem; min-width: 90px; color: var(--primary); line-height: 1.6; }
        .analysis-count { font-size: .83rem; color: var(--text); flex-shrink: 0; min-width: 70px; line-height: 1.6; }
        .analysis-notes { font-size: .82rem; color: var(--muted); flex: 1; line-height: 1.7; }
        .an-tag { display: inline-block; padding: 1px 7px; border-radius: 4px; font-size: .74rem; font-weight: 600; margin: 1px 2px 1px 0; }
        .an-warn { background: #FEF3C7; color: #D97706; }
        .an-alert { background: #FEE2E2; color: #DC2626; }
        .an-good { background: #D1FAE5; color: #065F46; }
        .analysis-chart-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px 20px; }
        .analysis-chart-title { font-size: .9rem; font-weight: 700; margin-bottom: 12px; }
        .analysis-chart-wrap { position: relative; height: 160px; }
    </style>
</head>
<body>

<!-- 비밀번호 -->
<div id="pw-screen">
    <div class="pw-card">
        <div class="logo">📋</div>
        <h2>팀 업무 리마인더</h2>
        <p>비밀번호를 입력하세요</p>
        <input type="password" id="pw-input" placeholder="비밀번호" onkeydown="if(event.key==='Enter')login()">
        <button class="pw-btn" onclick="login()">입장하기</button>
        <div class="pw-err" id="pw-err"></div>
    </div>
</div>

<!-- 앱 -->
<div id="app">
    <div class="header">
        <div class="header-top">
            <div>
                <div class="header-title" id="site-title">팀 업무 리마인더</div>
                <div class="header-date" id="today-date"></div>
            </div>
            <div class="header-actions">
                <button class="btn btn-secondary btn-sm" onclick="openReminderModal()">📋 현황</button>
                <button class="btn btn-primary btn-sm" onclick="openAddTask()">+ 업무 추가</button>
                <button class="btn btn-secondary btn-sm" onclick="toggleSettings()">⚙</button>
            </div>
        </div>
        <div class="tabs">
            <button class="tab-btn active" data-tab="board" onclick="switchTab('board')">📋 보드</button>
            <button class="tab-btn" data-tab="done" onclick="switchTab('done')">✅ 완료 업무</button>
            <button class="tab-btn" data-tab="calendar" onclick="switchTab('calendar')">📅 완료 캘린더</button>
            <button class="tab-btn" data-tab="analysis" onclick="switchTab('analysis')">📊 업무 분석</button>
            <button class="tab-btn-feed" data-tab="feed" onclick="switchTab('feed')">📢 피드</button>
        </div>
    </div>

    <div class="settings-menu" id="settings-menu">
        <button onclick="openSettings()">🔧 설정 변경</button>
        <button onclick="logout()" class="danger">🔒 로그아웃</button>
    </div>

    <!-- 일반 리마인더 배너 -->
    <div class="reminder-banner" id="reminder-banner">
        <span>⚠️</span>
        <div class="banner-text"><strong>미완료 업무 알림</strong><span id="banner-text"></span></div>
        <div class="banner-actions">
            <button class="btn btn-kakao btn-sm" onclick="shareKakao()">카카오톡 공유</button>
            <button class="btn btn-secondary btn-sm" onclick="dismissBanner()">닫기</button>
        </div>
    </div>

    <!-- 마감 임박 배너 -->
    <div class="deadline-banner" id="deadline-banner">
        <div class="deadline-banner-top">
            <span>🚨</span>
            <div class="banner-text" id="deadline-banner-text"></div>
            <div class="banner-actions">
                <button class="btn btn-secondary btn-sm" onclick="dismissDeadlineBanner()">닫기</button>
            </div>
        </div>
        <div class="deadline-groups" id="deadline-groups"></div>
    </div>

    <!-- 탭: 보드 -->
    <div id="tab-board" class="tab-pane active">
        <!-- 통계 위젯 -->
        <div class="stats-widget" id="stats-widget"></div>
        <div class="stat-bar-wrap" id="stat-bar-wrap"></div>

        <!-- 상시 업무 섹션 -->
        <div class="routine-section">
            <div class="routine-head">
                <div class="routine-head-left">
                    <span class="routine-head-title">🔄 상시 업무</span>
                    <span class="routine-count" id="routine-count">0</span>
                </div>
                <button class="btn btn-secondary btn-sm" onclick="openAddTask(true)">+ 추가</button>
            </div>
            <div class="routine-body" id="routine-body"
                ondragover="routineDragOver(event)"
                ondragleave="routineDragLeave(event)"
                ondrop="routineDrop(event)">
                <span class="routine-empty">상시 업무를 추가하면 여기에 표시됩니다.</span>
            </div>
        </div>

        <!-- 칸반 -->
        <div class="board-wrap">
            <div class="board">
                <div class="col">
                    <div class="col-head">
                        <div class="col-title"><span class="dot dot-red"></span>작업 시작 안함</div>
                        <span class="col-count" id="cnt-ns">0</span>
                    </div>
                    <div class="col-body" id="col-ns"
                        ondragover="dragOver(event)"
                        ondragleave="dragLeave(event)"
                        ondrop="drop(event,'작업 시작 안함')"></div>
                </div>
                <div class="col">
                    <div class="col-head">
                        <div class="col-title"><span class="dot dot-amber"></span>작업중</div>
                        <span class="col-count" id="cnt-ip">0</span>
                    </div>
                    <div class="col-body" id="col-ip"
                        ondragover="dragOver(event)"
                        ondragleave="dragLeave(event)"
                        ondrop="drop(event,'작업중')"></div>
                </div>
                <div class="col">
                    <div class="col-head">
                        <div class="col-title"><span class="dot dot-green"></span>완료</div>
                        <span class="col-count" id="cnt-dn">0</span>
                    </div>
                    <div class="col-body" id="col-dn"
                        ondragover="dragOver(event)"
                        ondragleave="dragLeave(event)"
                        ondrop="drop(event,'완료')"></div>
                </div>
            </div>
        </div>

        <!-- 담당자 섹션 -->
        <div class="person-section">
            <div class="person-section-head">
                <div class="person-section-title">👤 담당자별 업무</div>
                <div class="person-add-row">
                    <input id="new-member-input" type="text" placeholder="인원 직접 추가"
                           onkeydown="if(event.key==='Enter')addMember()">
                    <button class="btn btn-secondary btn-sm" onclick="addMember()">추가</button>
                </div>
            </div>
            <div class="person-grid" id="person-grid"
                ondragover="personGridDragOver(event)"
                ondragleave="personGridDragLeave(event)"
                ondrop="personGridDrop(event)"></div>
        </div>

        <!-- 참고 링크 섹션 -->
        <div class="links-section">
            <div class="links-section-head">
                <div class="links-section-title">🔗 참고 링크</div>
                <button class="btn btn-secondary btn-sm" onclick="openAddLink()">+ 링크 추가</button>
            </div>
            <div class="links-grid" id="links-grid"></div>
        </div>
    </div>

    <!-- 탭: 완료 업무 -->
    <div id="tab-done" class="tab-pane">
        <div class="done-wrap">
            <div class="done-filter">
                <select id="f-done-year" onchange="applyDoneFilter()"></select>
                <select id="f-done-month" onchange="applyDoneFilter()">
                    <option value="0">전체 월</option>
                    <option value="1">1월</option><option value="2">2월</option><option value="3">3월</option>
                    <option value="4">4월</option><option value="5">5월</option><option value="6">6월</option>
                    <option value="7">7월</option><option value="8">8월</option><option value="9">9월</option>
                    <option value="10">10월</option><option value="11">11월</option><option value="12">12월</option>
                </select>
                <select id="f-done-day" onchange="applyDoneFilter()">
                    <option value="0">전체 일</option>
                </select>
                <input type="text" id="f-done-q" placeholder="🔍 업무명 / 담당자 검색" oninput="applyDoneFilter()">
                <span class="done-count" id="done-count">총 0건</span>
            </div>
            <div class="done-list" id="done-list"></div>
        </div>
    </div>

    <!-- 탭: 활동 피드 -->
    <div id="tab-feed" class="tab-pane">
        <div class="feed-wrap" id="feed-wrap">
            <div class="empty-state"><div class="ei">📭</div><p>아직 활동 내역이 없습니다.</p></div>
        </div>
    </div>

    <!-- 탭: 업무 분석 -->
    <div id="tab-analysis" class="tab-pane">
        <div class="analysis-wrap" id="analysis-wrap">
            <div class="analysis-filter">
                <button class="af-btn" data-period="day" onclick="setAnalysisPeriod('day')">일별</button>
                <button class="af-btn" data-period="week" onclick="setAnalysisPeriod('week')">주별</button>
                <button class="af-btn active" data-period="month" onclick="setAnalysisPeriod('month')">달별</button>
                <button class="af-btn" data-period="year" onclick="setAnalysisPeriod('year')">연별</button>
            </div>
            <div id="analysis-text-section"></div>
            <div id="analysis-charts-section"></div>
        </div>
    </div>

    <!-- 탭: 완료 캘린더 -->
    <div id="tab-calendar" class="tab-pane">
        <div class="cal-layout">
            <div class="cal-left">
                <div class="cal-left-head">
                    <span>📌 진행중인 업무</span>
                    <span class="col-count" id="cal-left-count">0</span>
                </div>
                <div class="cal-left-body" id="cal-left-body"></div>
            </div>
            <div class="cal-right">
                <div class="cal-nav">
                    <button class="cal-nav-btn" onclick="calMove(-1)">‹</button>
                    <span class="cal-month" id="cal-month-label"></span>
                    <button class="cal-nav-btn" onclick="calMove(1)">›</button>
                </div>
                <div class="cal-body">
                    <div class="cal-grid" id="cal-grid"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 업무 모달 -->
<div class="overlay" id="task-overlay" onclick="if(event.target===this)closeTaskModal()">
    <div class="modal">
        <h2 id="task-modal-h">업무 추가</h2>
        <div class="form-row">
            <label>업무명 *</label>
            <input id="f-title" type="text" placeholder="업무 제목">
        </div>
        <div class="form-row">
            <label>담당자 (선택)</label>
            <input id="f-assignee" type="text" list="assignee-list" placeholder="담당자 이름">
            <datalist id="assignee-list"></datalist>
        </div>
        <div class="form-row">
            <label>설명 (선택)</label>
            <textarea id="f-desc" placeholder="상세 내용"></textarea>
        </div>
        <div class="attach-section">
            <div class="attach-section-title">📎 첨부 파일</div>
            <div class="attach-btn-row">
                <label class="attach-label">
                    파일 선택
                    <input type="file" id="f-attach" style="display:none" multiple
                        accept="image/*,.pdf,.xlsx,.xls,.docx,.doc,.pptx,.ppt,.txt,.zip"
                        onchange="handleFileSelect(event)">
                </label>
                <span class="upload-status" id="upload-status"></span>
            </div>
            <div class="attach-list" id="attach-list"></div>
        </div>
        <div class="form-row-inline">
            <div class="form-row">
                <label>우선순위</label>
                <select id="f-priority">
                    <option value="보통">보통</option>
                    <option value="높음">🔴 높음</option>
                    <option value="낮음">🟢 낮음</option>
                </select>
            </div>
            <div class="form-row">
                <label>마감일 (선택)</label>
                <input id="f-duedate" type="date">
            </div>
        </div>
        <div class="form-row">
            <label>상태</label>
            <select id="f-status">
                <option value="작업 시작 안함">작업 시작 안함</option>
                <option value="작업중">작업중</option>
                <option value="완료">완료</option>
            </select>
        </div>
        <div class="checkbox-row">
            <input type="checkbox" id="f-routine">
            <label for="f-routine">🔄 상시 업무로 등록 (칸반 보드와 분리)</label>
        </div>
        <div id="comment-section" style="display:none">
            <div class="comment-section">
                <div class="comment-section-title">💬 댓글</div>
                <div class="comment-list" id="comment-list"></div>
                <div class="comment-input-row">

<script>
const SOURCE_PASSWORD = '9988';

firebase.initializeApp({
    apiKey: "AIzaSyBcrvuu9cMpCxdvsR_PqrktHWXK5e6dpFc",
    authDomain: "sbscheonans.firebaseapp.com",
    projectId: "sbscheonans",
    storageBucket: "sbscheonans.firebasestorage.app",
    messagingSenderId: "901448586994",
    appId: "1:901448586994:web:725325cb2ab3b3b870e26b"
});
const db = firebase.firestore();
const CLOUDINARY_CLOUD = 'dbdi00mlm';
const CLOUDINARY_PRESET = 'sbscheonans';

let CFG = { siteTitle: '팀 업무 리마인더', kakaoKey: '' };

// ── 인증 ──
function login() {
    if (document.getElementById('pw-input').value === SOURCE_PASSWORD) {
        sessionStorage.setItem('auth', '1');
        document.getElementById('pw-screen').style.display = 'none';
        document.getElementById('app').style.display = 'flex';
        bootApp();
    } else {
        document.getElementById('pw-err').textContent = '비밀번호가 올바르지 않습니다.';
        document.getElementById('pw-input').value = '';
    }
}
function logout() { sessionStorage.removeItem('auth'); location.reload(); }

// ── 데이터 ──
let tasks = [], members = [], links = [], colOrder = {}, routineOrder = [], memberOrder = [], activity = [], dataLoaded = false;
let commentsUnsubscribe = null;
let currentAttachments = [], pendingTaskId = null;

function loadData() {
    db.collection('tasks').onSnapshot(snapshot => {
        tasks = snapshot.docs.map(doc => ({ ...doc.data(), id: doc.id }));
        if (!dataLoaded) {
            dataLoaded = true;
            checkDailyReminder();
            checkDeadlineBanner();
        }
        updateAssigneeList();
        renderAll();
    });
    db.doc('config/app').onSnapshot(doc => {
        const data = doc.data() || {};
        members  = data.members  || [];
        links    = data.links    || [];
        colOrder      = data.colOrder      || {};
        routineOrder  = data.routineOrder  || [];
        if (data.siteTitle) {
            CFG.siteTitle = data.siteTitle;
            document.title = CFG.siteTitle;
            const el = document.getElementById('site-title');
            if (el) el.textContent = CFG.siteTitle;
        }
        if (data.kakaoKey !== undefined) CFG.kakaoKey = data.kakaoKey;
        memberOrder = data.memberOrder || [];
        initKakao();
        updateAssigneeList();
        renderAll();
    });
    db.collection('activity').orderBy('createdAt', 'desc').limit(100).onSnapshot(snapshot => {
        activity = snapshot.docs.map(d => d.data());
        if (activeTab === 'feed') renderFeedTab();
    });
}
function saveMembers()      { db.doc('config/app').set({ members },      { merge: true }); }
function saveLinks()        { db.doc('config/app').set({ links },        { merge: true }); }
function saveColOrder()     { db.doc('config/app').set({ colOrder },     { merge: true }); }
function saveRoutineOrder() { db.doc('config/app').set({ routineOrder }, { merge: true }); }
function saveMemberOrder()  { db.doc('config/app').set({ memberOrder },  { merge: true }); renderPersonSection(); }

// ── 담당자 카드 드래그 순서 ──
let personDragName = null;

function personCardDragStart(e, name) {
    personDragName = name;
    e.dataTransfer.effectAllowed = 'move';
    setTimeout(() => e.currentTarget.classList.add('dragging'), 0);
}
function personCardDragEnd(e) {
    e.currentTarget.classList.remove('dragging');
    const g = document.getElementById('person-grid');
    if (g) g.classList.remove('drag-over-person');
}
function personGridDragOver(e) {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    e.currentTarget.classList.add('drag-over-person');
}
function personGridDragLeave(e) {
    if (!e.currentTarget.contains(e.relatedTarget)) e.currentTarget.classList.remove('drag-over-person');
}
function personGridDrop(e) {
    e.preventDefault();
    e.currentTarget.classList.remove('drag-over-person');
    if (!personDragName) return;
    const cards = [...e.currentTarget.querySelectorAll('.person-card[data-person]')].filter(c => c.dataset.person !== personDragName);
    let insertBefore = null;
    for (const card of cards) {
        const r = card.getBoundingClientRect();
        if (e.clientY < r.top + r.height / 2) { insertBefore = card.dataset.person; break; }
    }
    const allA = getAllAssignees();
    const base = memberOrder.length ? [...memberOrder] : [...allA];
    const extras = allA.filter(a => !base.includes(a));
    const full = [...base, ...extras];
    const filtered = full.filter(n => n !== personDragName);
    if (insertBefore) {
        const idx = filtered.indexOf(insertBefore);
        idx !== -1 ? filtered.splice(idx, 0, personDragName) : filtered.push(personDragName);
    } else {
        filtered.push(personDragName);
    }
    memberOrder = filtered;
    saveMemberOrder();
    personDragName = null;
}

function logActivity(type, taskId, taskTitle, detail) {
    const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
    db.collection('activity').doc(id).set({ id, type, taskId: taskId || '', taskTitle: taskTitle || '', detail: detail || '', createdAt: Date.now() });
}

function getAllAssignees() {
    const fromTasks = tasks.map(t => t.assignee).filter(a => a && a.trim());
    return [...new Set([...members, ...fromTasks])];
}
function updateAssigneeList() {
    const dl = document.getElementById('assignee-list');
    if (!dl) return;
    dl.innerHTML = getAllAssignees().map(m => `<option value="${esc(m)}">`).join('');
}

// ── 부팅 ──
let activeTab = 'board';

function bootApp() {
    const now = new Date();
    const days = ['일','월','화','수','목','금','토'];
    document.getElementById('today-date').textContent =
        `${now.getFullYear()}년 ${now.getMonth()+1}월 ${now.getDate()}일 (${days[now.getDay()]})`;
    loadData();
}
function initKakao() {
    if (CFG.kakaoKey && window.Kakao && !Kakao.isInitialized()) Kakao.init(CFG.kakaoKey);
}
function renderAll() {
    renderStatsWidget();
    renderRoutineSection();
    renderBoard();
    renderPersonSection();
    renderLinksSection();
    if (activeTab === 'done')     renderDoneTab();
    if (activeTab === 'calendar') renderCalendarTab();
    if (activeTab === 'feed')     renderFeedTab();
    if (activeTab === 'analysis') renderAnalysisTab();
}

// ── 탭 ──
function switchTab(name) {
    activeTab = name;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
    document.querySelectorAll('.tab-btn-feed').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
    document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
    document.getElementById(`tab-${name}`).classList.add('active');
    if (name === 'done')     renderDoneTab();
    if (name === 'calendar') renderCalendarTab();
    if (name === 'feed')     renderFeedTab();
    if (name === 'analysis') renderAnalysisTab();
}

// ── 통계 위젯 ──
function renderStatsWidget() {
    const normal = tasks.filter(t => !t.isRoutine);
    const total  = normal.length;
    const ns     = normal.filter(t => t.status === '작업 시작 안함').length;
    const ip     = normal.filter(t => t.status === '작업중').length;
    const dn     = normal.filter(t => t.status === '완료').length;
    const rate   = total ? Math.round(dn / total * 100) : 0;
    document.getElementById('stats-widget').innerHTML = `
        <div class="stat-card"><div class="stat-num primary">${total}</div><div class="stat-label">전체</div></div>
        <div class="stat-card"><div class="stat-num red">${ns}</div><div class="stat-label">미시작</div></div>
        <div class="stat-card"><div class="stat-num amber">${ip}</div><div class="stat-label">작업중</div></div>
        <div class="stat-card"><div class="stat-num green">${dn}</div><div class="stat-label">완료</div></div>
        <div class="stat-card"><div class="stat-num primary">${rate}%</div><div class="stat-label">완료율</div></div>
    `;
    document.getElementById('stat-bar-wrap').innerHTML = `
        <div class="stat-bar-track"><div class="stat-bar-fill" style="width:${rate}%"></div></div>
        <div class="stat-bar-label">${dn} / ${total}건 완료</div>
    `;
}

// ── 상시 업무 섹션 ──
function renderRoutineSection() {
    const routines = tasks.filter(t => t.isRoutine);
    const cnt  = document.getElementById('routine-count');
    const body = document.getElementById('routine-body');
    if (cnt) cnt.textContent = routines.length;
    if (!body) return;
    if (!routines.length) {
        body.innerHTML = `<span class="routine-empty">상시 업무를 추가하면 여기에 표시됩니다. "+ 추가" 버튼을 눌러보세요.</span>`;
        return;
    }
    const order = routineOrder.length ? routineOrder : [];
    routines.sort((a, b) => {
        const ai = order.indexOf(a.id), bi = order.indexOf(b.id);
        if (ai !== -1 && bi !== -1) return ai - bi;
        if (ai !== -1) return -1;
        if (bi !== -1) return 1;
        return (a.createdAt || 0) - (b.createdAt || 0);
    });
    body.innerHTML = routines.map(t => {
        const done = t.status === '완료';
        return `<div class="routine-item${done ? ' done' : ''}" data-id="${t.id}" draggable="true"
            ondragstart="routineDragStart(event,'${t.id}')"
            ondragend="routineDragEnd(event)">
            <div class="routine-check" onclick="event.stopPropagation();toggleRoutine('${t.id}')" title="완료 토글">${done ? '✓' : ''}</div>
            <div onclick="openEdit('${t.id}')" style="cursor:pointer">
                <div class="routine-title">${esc(t.title)}</div>
                ${t.assignee ? `<div class="routine-assignee">👤 ${esc(t.assignee)}</div>` : ''}
            </div>
            <button class="routine-edit-btn" onclick="openEdit('${t.id}')" title="수정">✎</button>
        </div>`;
    }).join('');
}

function toggleRoutine(id) {
    const t = tasks.find(x => x.id === id);
    if (!t) return;
    const newStatus = t.status === '완료' ? '작업 시작 안함' : '완료';
    db.collection('tasks').doc(id).update({
        status: newStatus,
        doneAt: newStatus === '완료' ? Date.now() : null
    });
    logActivity('routine_toggle', id, t.title, newStatus === '완료' ? '완료' : '재시작');
    showToast(newStatus === '완료' ? '완료 처리됨' : '다시 시작');
}

// ── 마감 임박 배너 ──
function checkDeadlineBanner() {
    const now = new Date(); now.setHours(0, 0, 0, 0);
    const tomorrow = new Date(now); tomorrow.setDate(tomorrow.getDate() + 1);

    const overDue = tasks.filter(t => {
        if (t.status === '완료' || !t.dueDate || t.isRoutine) return false;
        const due = new Date(t.dueDate); due.setHours(0, 0, 0, 0);
        return due.getTime() < now.getTime();
    });
    const todayDue = tasks.filter(t => {
        if (t.status === '완료' || !t.dueDate || t.isRoutine) return false;
        const due = new Date(t.dueDate); due.setHours(0, 0, 0, 0);
        return due.getTime() === now.getTime();
    });
    const tomorrowDue = tasks.filter(t => {
        if (t.status === '완료' || !t.dueDate || t.isRoutine) return false;
        const due = new Date(t.dueDate); due.setHours(0, 0, 0, 0);
        return due.getTime() === tomorrow.getTime();
    });

    const all = [...overDue, ...todayDue, ...tomorrowDue];
    if (!all.length) return;

    const parts = [];
    if (overDue.length)     parts.push(`마감 초과 ${overDue.length}건`);
    if (todayDue.length)    parts.push(`오늘 마감 ${todayDue.length}건`);
    if (tomorrowDue.length) parts.push(`내일 마감 ${tomorrowDue.length}건`);
    document.getElementById('deadline-banner-text').innerHTML =
        `<strong>마감 임박!</strong> ${parts.join(' | ')}`;

    // 담당자별 그룹핑
    const byAssignee = {};
    all.forEach(t => {
        const key = (t.assignee && t.assignee.trim()) ? t.assignee.trim() : '담당자 없음';
        if (!byAssignee[key]) byAssignee[key] = [];
        byAssignee[key].push(t);
    });
    const groupsHtml = Object.entries(byAssignee).map(([name, items]) => {
        const chips = items.map(t => {
            const due = new Date(t.dueDate); due.setHours(0, 0, 0, 0);
            const cls   = due < now ? 'over' : due.getTime() === now.getTime() ? 'today' : 'tomorrow';
            const label = due < now ? '초과' : due.getTime() === now.getTime() ? '오늘' : '내일';
            return `<span class="deadline-task-chip ${cls}">${esc(t.title)} · ${label}</span>`;
        }).join('');
        return `<div class="deadline-group"><span class="deadline-group-name">👤 ${esc(name)}</span>${chips}</div>`;
    }).join('');
    document.getElementById('deadline-groups').innerHTML = groupsHtml;
    document.getElementById('deadline-banner').classList.add('show');
}
function dismissDeadlineBanner() {
    document.getElementById('deadline-banner').classList.remove('show');
}

// ── 칸반 보드 ──
let doneColExpanded = false;

function renderBoard() {
    renderCol('작업 시작 안함', 'col-ns', 'cnt-ns');
    renderCol('작업중',         'col-ip', 'cnt-ip');
    renderCol('완료',           'col-dn', 'cnt-dn');
}

function toggleDoneExpand() {
    doneColExpanded = !doneColExpanded;
    renderBoard();
}

const PRIO_ORDER = { '높음': 0, '보통': 1, '낮음': 2 };
const DONE_LIMIT = 5;

function renderCol(status, colId, cntId) {
    const list = tasks.filter(t => t.status === status && !t.isRoutine);
    document.getElementById(cntId).textContent = list.length;
    const el = document.getElementById(colId);
    if (!list.length) {
        el.innerHTML = `<div class="empty-state"><div class="ei">${status === '완료' ? '✅' : '📝'}</div><p>업무 없음</p></div>`;
        return;
    }
    const order = colOrder[status] || [];
    list.sort((a, b) => {
        const ai = order.indexOf(a.id), bi = order.indexOf(b.id);
        if (ai !== -1 && bi !== -1) return ai - bi;
        if (ai !== -1) return -1;
        if (bi !== -1) return 1;
        const pa = PRIO_ORDER[a.priority] ?? 1;
        const pb = PRIO_ORDER[b.priority] ?? 1;
        if (pa !== pb) return pa - pb;
        return (a.createdAt || 0) - (b.createdAt || 0);
    });
    const isDone = status === '완료';
    const displayList = isDone && !doneColExpanded && list.length > DONE_LIMIT ? list.slice(0, DONE_LIMIT) : list;
    el.innerHTML = displayList.map(t => taskCard(t)).join('');
    if (isDone && list.length > DONE_LIMIT) {
        el.innerHTML += doneColExpanded
            ? `<button class="more-btn" onclick="toggleDoneExpand()">접기 ▴</button>`
            : `<button class="more-btn" onclick="toggleDoneExpand()">더보기 ${list.length - DONE_LIMIT}건 ▾</button>`;
    }
}

function dueBadge(dueDate, status) {
    if (!dueDate || status === '완료') return '';
    const now = new Date(); now.setHours(0, 0, 0, 0);
    const tomorrow = new Date(now); tomorrow.setDate(tomorrow.getDate() + 1);
    const due = new Date(dueDate); due.setHours(0, 0, 0, 0);
    const diff = due.getTime() - now.getTime();
    if (diff < 0)           return `<span class="due-badge due-over">⚠ 마감 초과</span>`;
    if (diff === 0)         return `<span class="due-badge due-today">🔴 오늘 마감</span>`;
    if (diff === 86400000)  return `<span class="due-badge due-tomorrow">🟡 내일 마감</span>`;
    const d = new Date(dueDate);
    return `<span class="due-badge due-normal">${d.getMonth()+1}/${d.getDate()} 마감</span>`;
}

function prioBadge(priority) {
    if (!priority || priority === '보통') return '';
    return `<span class="priority-badge ${priority === '높음' ? 'prio-high' : 'prio-low'}">${priority}</span>`;
}

function taskCard(t) {
    const d = new Date(t.createdAt);
    const dateStr = `${d.getMonth()+1}/${d.getDate()}`;
    const btnMap = {
        '작업 시작 안함': [['작업중','▶ 시작'],['완료','✓ 완료']],
        '작업중':         [['완료','✓ 완료'],['작업 시작 안함','← 되돌리기']],
        '완료':           [['작업중','↩ 재개'],['작업 시작 안함','처음으로']],
    };
    const btns = (btnMap[t.status] || []).map(([s, l]) =>
        `<button class="s-btn" onclick="event.stopPropagation();quickStatus('${t.id}','${s}')">${l}</button>`
    ).join('');
    const badges = prioBadge(t.priority) + dueBadge(t.dueDate, t.status);
    return `<div class="task-card${t.status === '완료' ? ' is-done' : ''}"
        data-id="${t.id}"
        draggable="true"
        ondragstart="dragStart(event,'${t.id}')"
        ondragend="dragEnd(event)"
        onclick="openEdit('${t.id}')">
        <div class="card-title">${esc(t.title)}</div>
        ${badges ? `<div class="card-badges">${badges}</div>` : ''}
        ${t.desc     ? `<div class="card-sub">${esc(t.desc)}</div>` : ''}
        ${t.assignee ? `<div class="card-sub">👤 ${esc(t.assignee)}</div>` : ''}
        <div class="status-btns">${btns}</div>
        <div class="card-date">${t.attachments && t.attachments.length ? `<span style="margin-right:4px">📎${t.attachments.length}</span>` : ''}${dateStr}</div>
    </div>`;
}

function quickStatus(id, s) {
    const task = tasks.find(x => x.id === id);
    if (!task) return;
    db.collection('tasks').doc(id).update({ status: s, doneAt: s === '완료' ? Date.now() : null });
    logActivity('status', id, task.title, s);
    showToast(`상태 변경: ${s}`);
}

// ── 드래그 앤 드롭 ──
let dragId = null;

function dragStart(e, id) {
    dragId = id;
    e.dataTransfer.effectAllowed = 'move';
    setTimeout(() => e.target.classList.add('dragging'), 0);
}
function dragEnd(e) {
    e.target.classList.remove('dragging');
    document.querySelectorAll('.col-body').forEach(el => el.classList.remove('drag-over'));
}
function dragOver(e) {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    e.currentTarget.classList.add('drag-over');
}
function dragLeave(e) {
    if (!e.currentTarget.contains(e.relatedTarget)) {
        e.currentTarget.classList.remove('drag-over');
    }
}
function drop(e, status) {
    e.preventDefault();
    e.currentTarget.classList.remove('drag-over');
    if (!dragId) return;

    const dragTask = tasks.find(t => t.id === dragId);
    if (!dragTask) return;

    if (dragTask.status !== status) {
        db.collection('tasks').doc(dragId).update({
            status,
            doneAt: status === '완료' ? Date.now() : null
        });
        logActivity('status', dragId, dragTask.title, status);
        showToast(`상태 변경: ${status}`);
    }

    // 드롭 위치 계산
    const col = e.currentTarget;
    const cards = [...col.querySelectorAll('.task-card[data-id]')].filter(c => c.dataset.id !== dragId);
    let insertBeforeId = null;
    for (const card of cards) {
        const rect = card.getBoundingClientRect();
        if (e.clientY < rect.top + rect.height / 2) {
            insertBeforeId = card.dataset.id;
            break;
        }
    }

    const base = colOrder[status]
        ? [...colOrder[status]]
        : tasks.filter(t => t.status === status && !t.isRoutine).map(t => t.id);
    const filtered = base.filter(id => id !== dragId);
    if (insertBeforeId) {
        const idx = filtered.indexOf(insertBeforeId);
        idx !== -1 ? filtered.splice(idx, 0, dragId) : filtered.push(dragId);
    } else {
        filtered.push(dragId);
    }
    colOrder[status] = filtered;

    if (dragTask.status !== status) {
        colOrder[dragTask.status] = (colOrder[dragTask.status] || []).filter(id => id !== dragId);
    }
    saveColOrder();
    dragId = null;
}

// ── 상시 업무 드래그 ──
let routineDragId = null;

function routineDragStart(e, id) {
    routineDragId = id;
    e.dataTransfer.effectAllowed = 'move';
    setTimeout(() => e.target.classList.add('dragging'), 0);
}
function routineDragEnd(e) {
    e.target.classList.remove('dragging');
    const body = document.getElementById('routine-body');
    if (body) body.classList.remove('drag-over-routine');
}
function routineDragOver(e) {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    e.currentTarget.classList.add('drag-over-routine');
}
function routineDragLeave(e) {
    if (!e.currentTarget.contains(e.relatedTarget)) {
        e.currentTarget.classList.remove('drag-over-routine');
    }
}
function routineDrop(e) {
    e.preventDefault();
    e.currentTarget.classList.remove('drag-over-routine');
    if (!routineDragId) return;
    const items = [...e.currentTarget.querySelectorAll('.routine-item[data-id]')].filter(el => el.dataset.id !== routineDragId);
    let insertBeforeId = null;
    for (const item of items) {
        const rect = item.getBoundingClientRect();
        if (e.clientY < rect.bottom && e.clientX < rect.left + rect.width / 2) {
            insertBeforeId = item.dataset.id;
            break;
        }
    }
    const routines = tasks.filter(t => t.isRoutine);
    const base = routineOrder.length ? [...routineOrder] : routines.map(t => t.id);
    const filtered = base.filter(id => id !== routineDragId);
    if (insertBeforeId) {
        const idx = filtered.indexOf(insertBeforeId);
        idx !== -1 ? filtered.splice(idx, 0, routineDragId) : filtered.push(routineDragId);
    } else {
        filtered.push(routineDragId);
    }
    routineOrder = filtered;
    saveRoutineOrder();
    routineDragId = null;
}

// ── 담당자 섹션 ──
function pTaskDue(dueDate) {
    if (!dueDate) return '';
    const now = new Date(); now.setHours(0,0,0,0);
    const due = new Date(dueDate); due.setHours(0,0,0,0);
    const diff = Math.round((due - now) / 86400000);
    let color, label;
    if (diff < 0)        { color = 'var(--red)';   label = `D+${Math.abs(diff)} 초과`; }
    else if (diff === 0) { color = 'var(--red)';   label = `D-Day (${due.getMonth()+1}/${due.getDate()})`; }
    else if (diff <= 3)  { color = 'var(--red)';   label = `D-${diff} (${due.getMonth()+1}/${due.getDate()})`; }
    else if (diff <= 7)  { color = 'var(--amber)'; label = `D-${diff} (${due.getMonth()+1}/${due.getDate()})`; }
    else                 { color = '#94A3B8';       label = `${due.getMonth()+1}/${due.getDate()} 마감`; }
    return `<span style="font-size:.7rem;color:${color};display:block;margin-top:2px">📅 ${label}</span>`;
}

    }
    const ordered = memberOrder.filter(m => allAssignees.includes(m));
    const rest = allAssignees.filter(m => !memberOrder.includes(m));
    const sortedAssignees = [...ordered, ...rest].filter(m => m !== '상시업무');
    grid.innerHTML = sortedAssignees.map(m => {
        const mt = incomplete.filter(t => t.assignee === m);

            </div>

// ── 완료 업무 탭 ──
function renderDoneTab() {
    const doneTasks = tasks.filter(t => t.status === '완료' && t.doneAt);
    const years = [...new Set(doneTasks.map(t => new Date(t.doneAt).getFullYear()))];
    const curYear = new Date().getFullYear();
    if (!years.includes(curYear)) years.push(curYear);
    years.sort((a, b) => b - a);
    const ySel = document.getElementById('f-done-year');
    const prevYear = ySel.value;
    ySel.innerHTML = years.map(y => `<option value="${y}">${y}년</option>`).join('');
    if (prevYear && years.includes(+prevYear)) ySel.value = prevYear;
    const dSel = document.getElementById('f-done-day');
    const prevDay = dSel.value;
    dSel.innerHTML = '<option value="0">전체 일</option>' +
        Array.from({length:31}, (_,i) => `<option value="${i+1}">${i+1}일</option>`).join('');
    if (prevDay) dSel.value = prevDay;
    applyDoneFilter();
}

function applyDoneFilter() {
    const year  = +document.getElementById('f-done-year').value;
    const month = +document.getElementById('f-done-month').value;
    const day   = +document.getElementById('f-done-day').value;
    const q     = document.getElementById('f-done-q').value.trim().toLowerCase();
    let list = tasks.filter(t => {
        if (t.status !== '완료' || !t.doneAt) return false;
        const d = new Date(t.doneAt);
        if (year  && d.getFullYear()  !== year)  return false;
        if (month && d.getMonth() + 1 !== month) return false;
        if (day   && d.getDate()      !== day)   return false;
        if (q && !(t.title.toLowerCase().includes(q) || (t.assignee||'').toLowerCase().includes(q))) return false;
        return true;
    });
    list.sort((a, b) => b.doneAt - a.doneAt);
    document.getElementById('done-count').textContent = `총 ${list.length}건`;
    if (!list.length) {
        document.getElementById('done-list').innerHTML =
            `<div class="empty-state"><div class="ei">📭</div><p>해당 조건의 완료 업무가 없습니다</p></div>`;
        return;
    }
    const byDate = {};
    list.forEach(t => {
        const d = new Date(t.doneAt);
        const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        if (!byDate[key]) byDate[key] = [];
        byDate[key].push(t);
    });
    const dowNames = ['일','월','화','수','목','금','토'];
    let html = '';
    Object.keys(byDate).sort((a,b) => b.localeCompare(a)).forEach(key => {
        const d   = new Date(key);
        const hdr = `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 (${dowNames[d.getDay()]})`;
        html += `<div class="done-date-group">
            <div class="done-date-header"><span>${hdr}</span><span>${byDate[key].length}건</span></div>
            ${byDate[key].map(t => `
                <div class="done-item" onclick="openEdit('${t.id}')">
                    <div class="done-item-info">
                        <div class="done-item-title">${esc(t.title)}</div>
                        ${t.desc     ? `<div class="done-item-sub">${esc(t.desc)}</div>` : ''}
                        ${t.assignee ? `<div class="done-item-sub">👤 ${esc(t.assignee)}</div>` : ''}
                    </div>
                    <span class="badge" style="background:#D1FAE5;color:#065F46;flex-shrink:0">✓ 완료</span>
                </div>`).join('')}
        </div>`;
    });
    document.getElementById('done-list').innerHTML = html;
}

function calTaskLi(t) {
    return `<div class="cal-task-li" onclick="openEdit('${t.id}')">
        <div class="cal-task-li-title">${esc(t.title)}</div>
        ${t.assignee ? `<div class="cal-task-li-sub">👤 ${esc(t.assignee)}</div>` : ''}
    </div>`;
}

function calMove(dir) {
    calMonth += dir;
    if (calMonth < 0)  { calMonth = 11; calYear--; }
    if (calMonth > 11) { calMonth = 0;  calYear++; }
    renderCalendar();
}

function renderCalendar() {
    const months = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
    document.getElementById('cal-month-label').textContent = `${calYear}년 ${months[calMonth]}`;
    const firstDow  = new Date(calYear, calMonth, 1).getDay();
    const daysInMon = new Date(calYear, calMonth + 1, 0).getDate();
    const today     = new Date();
    const byDay = {};
    tasks.forEach(t => {
        if (t.status !== '완료' || !t.doneAt) return;
        const d = new Date(t.doneAt);
        if (d.getFullYear() !== calYear || d.getMonth() !== calMonth) return;
        const day = d.getDate();
        if (!byDay[day]) byDay[day] = [];
        byDay[day].push(t);
    });
    const dows = ['일','월','화','수','목','금','토'];
    let html = dows.map((d,i) =>
        `<div class="cal-dow" style="${i===0?'color:var(--red)':i===6?'color:#3B82F6':''}">${d}</div>`
    ).join('');
    for (let i = 0; i < firstDow; i++) html += '<div class="cal-cell empty"></div>';
    for (let d = 1; d <= daysInMon; d++) {
        const isToday = today.getFullYear()===calYear && today.getMonth()===calMonth && today.getDate()===d;
        const dayTasks = byDay[d] || [];
        const hasDone  = dayTasks.length > 0;
        const dow = (firstDow + d - 1) % 7;
        html += `<div class="cal-cell${isToday?' is-today':''}${hasDone?' has-done':''}"
            ${hasDone?`onclick="showDayModal(${d})"`:''}>
            <div class="cal-day-num" style="${dow===0?'color:var(--red)':dow===6?'color:#3B82F6':''}">${d}</div>
            ${hasDone?`<div class="cal-dots">
                ${dayTasks.slice(0,3).map(t=>`<div class="cal-dot-item">${esc(t.title)}</div>`).join('')}
                ${dayTasks.length>3?`<div class="cal-dot-item">+${dayTasks.length-3}건</div>`:''}
            </div>`:''}
        </div>`;
    }
    document.getElementById('cal-grid').innerHTML = html;
}

function showDayModal(day) {
    const months = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
    const dt = tasks.filter(t => {
        if (t.status !== '완료' || !t.doneAt) return false;
        const d = new Date(t.doneAt);
        return d.getFullYear()===calYear && d.getMonth()===calMonth && d.getDate()===day;

    if (dismissed === today || !lastVisit || lastVisit === today) return;
    const incomplete = tasks.filter(t => t.status !== '완료' && !t.isRoutine);

    const ns = incomplete.filter(t => t.status === '작업 시작 안함').length;

    document.getElementById('banner-text').textContent = ` — ${parts.join(' | ')}`;
    document.getElementById('reminder-banner').classList.add('show');

// ── 카카오 공유 ──
function shareKakao() {
    const d = new Date();
    let msg = `📋 [팀 업무 리마인더] ${d.getMonth()+1}월 ${d.getDate()}일\n\n`;
    function byAssignee(list) {
        const map = {};
        list.forEach(t => {
            const key = (t.assignee && t.assignee.trim()) ? t.assignee.trim() : '담당자 없음';
            if (!map[key]) map[key] = [];
            map[key].push(t);
        });
        return map;
    }
    function formatSection(icon, label, list) {
        let s = `${icon} ${label} (${list.length}건)\n`;
        if (!list.length) return s;
        Object.entries(byAssignee(list)).forEach(([name, items]) => {
            s += `  • ${name} (${items.length}건)\n`;
            items.forEach(t => { s += `    - ${t.title}\n`; });
        });
        return s;
    }
    const ip = tasks.filter(t => t.status === '작업중'         && !t.isRoutine);
    const ns = tasks.filter(t => t.status === '작업 시작 안함' && !t.isRoutine);
    const dn = tasks.filter(t => t.status === '완료'            && !t.isRoutine);
    msg += formatSection('🔶', '작업중', ip) + '\n';
    msg += formatSection('🔴', '미시작', ns) + '\n';
    msg += formatSection('✅', '완료', dn);
    const text = msg.trim();
    if (window.Kakao && Kakao.isInitialized()) {
        Kakao.Share.sendDefault({ objectType: 'text', text, link: { mobileWebUrl: location.href, webUrl: location.href } });
    } else {
        navigator.clipboard.writeText(text)
            .then(() => showToast('📋 클립보드에 복사됨! 카카오톡에 붙여넣기 하세요.', 4000))
            .catch(() => alert(text));
    }
}

function saveTask() {
    const title = document.getElementById('f-title').value.trim();
    if (!title) { showToast('업무명을 입력하세요.'); document.getElementById('f-title').focus(); return; }
    const status    = document.getElementById('f-status').value;
    const desc      = document.getElementById('f-desc').value.trim();
    const assignee  = document.getElementById('f-assignee').value.trim();
    const priority  = document.getElementById('f-priority').value;
    const dueDate   = document.getElementById('f-duedate').value;
    const isRoutine = document.getElementById('f-routine').checked;
    if (editId) {
        const t = tasks.find(x => x.id === editId);
        if (t) {
            if (t.status !== status) logActivity('status', editId, title, status);
            const updates = { title, desc, assignee, status, priority, dueDate, isRoutine };
            if (t.status !== '완료' && status === '완료') updates.doneAt = Date.now();
            if (t.status === '완료' && status !== '완료') updates.doneAt = null;
            db.collection('tasks').doc(editId).update(updates);
        }
        showToast('업무가 수정되었습니다.');
    } else {
        const id = pendingTaskId || Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
        db.collection('tasks').doc(id).set({
            id, title, desc, assignee, status, priority, dueDate, isRoutine,
            attachments: currentAttachments,
            createdAt: Date.now(),
            doneAt: status === '완료' ? Date.now() : null
        });
        logActivity('task_add', id, title, assignee);
        showToast('업무가 추가되었습니다.');
    }
    closeTaskModal();
}

function deleteEditing() {
    if (!editId || !confirm('이 업무를 삭제하시겠습니까?')) return;
    const task = tasks.find(x => x.id === editId);
    if (task) logActivity('task_del', editId, task.title, '');
    db.collection('tasks').doc(editId).delete();
    showToast('삭제되었습니다.'); closeTaskModal();
}

async function downloadFile(url, name) {
    try {
        const res = await fetch(url);
        const blob = await res.blob();
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = name;
        a.click();
        URL.revokeObjectURL(a.href);
    } catch(e) {
        window.open(url, '_blank', 'noopener');
    }
}

function fileTypeIcon(type) {
    if (!type) return '📄';
    if (type.startsWith('image/')) return '🖼';
    if (type.includes('pdf')) return '📕';
    if (type.includes('sheet') || type.includes('excel')) return '📗';
    if (type.includes('word') || type.includes('document')) return '📘';
    if (type.includes('presentation') || type.includes('powerpoint')) return '📙';
    if (type.includes('zip')) return '📦';
    return '📄';
}

function formatFileSize(bytes) {
    if (!bytes) return '';
    if (bytes < 1024) return bytes + 'B';
    if (bytes < 1048576) return (bytes / 1024).toFixed(1) + 'KB';
    return (bytes / 1048576).toFixed(1) + 'MB';
}

async function handleFileSelect(e) {
    const files = [...e.target.files];
    e.target.value = '';
    for (const file of files) {
        if (file.size > 10 * 1024 * 1024) { showToast(`${file.name}: 10MB 초과`); continue; }
        await uploadFile(file);
    }
}

async function uploadFile(file) {
    const targetId = editId || pendingTaskId;
    if (!targetId) return;
    const statusEl = document.getElementById('upload-status');
    statusEl.textContent = '업로드 중...';
    try {
        const formData = new FormData();
        formData.append('file', file);
        formData.append('upload_preset', CLOUDINARY_PRESET);
        formData.append('public_id', `tasks/${targetId}/${Date.now()}_${file.name.replace(/[^\w.\-]/g, '_')}`);

        const xhr = new XMLHttpRequest();
        const url = await new Promise((resolve, reject) => {
            xhr.upload.onprogress = e => {
                if (e.lengthComputable) statusEl.textContent = `업로드 중 ${Math.round(e.loaded / e.total * 100)}%`;
            };
            xhr.onload = () => {
                const res = JSON.parse(xhr.responseText);
                if (xhr.status === 200) resolve(res.secure_url);
                else reject(new Error(res.error?.message || '업로드 실패'));
            };
            xhr.onerror = () => reject(new Error('네트워크 오류'));
            xhr.open('POST', `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD}/auto/upload`);
            xhr.send(formData);
        });

        const att = {
            id: Date.now().toString(36) + Math.random().toString(36).slice(2, 5),
            name: file.name, url, type: file.type, size: file.size, createdAt: Date.now()
        };
        currentAttachments.push(att);
        if (editId) {
            db.collection('tasks').doc(editId).update({
                attachments: firebase.firestore.FieldValue.arrayUnion(att)
            });
        }
        renderAttachList();
        statusEl.textContent = '';
        showToast(`${file.name} 첨부 완료`);
    } catch (err) {
        statusEl.textContent = '';
        showToast('업로드 실패: ' + err.message);
        console.error(err);
    }
}

async function deleteAttachment(attId) {
    if (!confirm('첨부 파일을 삭제할까요?')) return;
