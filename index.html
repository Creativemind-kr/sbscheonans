<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>팀 업무 리마인더</title>
    <!-- <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.0/kakao.min.js"></script> -->
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --primary: #4F46E5; --primary-h: #4338CA;
            --bg: #F1F5F9; --card: #fff; --border: #E2E8F0;
            --text: #1E293B; --muted: #64748B;
            --red: #EF4444; --amber: #F59E0B; --green: #10B981;
            --radius: 10px;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

        /* ── 비밀번호 ── */
        #pw-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%); }
        .pw-card { background: #fff; padding: 44px 40px; border-radius: 20px; box-shadow: 0 24px 64px rgba(0,0,0,.22); width: 340px; text-align: center; }
        .pw-card .logo { font-size: 2.2rem; margin-bottom: 12px; }
        .pw-card h2 { font-size: 1.3rem; font-weight: 700; margin-bottom: 6px; }
        .pw-card p { color: var(--muted); font-size: .875rem; margin-bottom: 24px; }
        .pw-card input { width: 100%; padding: 12px 16px; border: 2px solid var(--border); border-radius: var(--radius); font-size: 1rem; outline: none; margin-bottom: 10px; transition: border-color .2s; }
        .pw-card input:focus { border-color: var(--primary); }
        .pw-card .pw-btn { width: 100%; padding: 12px; background: var(--primary); color: #fff; border: none; border-radius: var(--radius); font-size: 1rem; font-weight: 600; cursor: pointer; }
        .pw-card .pw-btn:hover { background: var(--primary-h); }
        .pw-err { color: var(--red); font-size: .82rem; margin-top: 8px; min-height: 18px; }

        /* ── 앱 ── */
        #app { display: none; flex-direction: column; min-height: 100vh; }

        /* 헤더 */
        .header { background: #fff; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 20; }
        .header-top { padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; }
        .header-title { font-size: 1.1rem; font-weight: 700; }
        .header-date { font-size: .78rem; color: var(--muted); margin-top: 2px; }
        .header-actions { display: flex; gap: 8px; align-items: center; }
        .tabs { display: flex; padding: 0 20px; }
        .tab-btn { padding: 10px 18px; background: none; border: none; font-size: .875rem; font-weight: 500; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all .15s; }
        .tab-btn:hover { color: var(--text); }
        .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }

        /* 배너 */
        .reminder-banner { display: none; background: #FFFBEB; border-bottom: 2px solid var(--amber); padding: 11px 24px; align-items: center; gap: 12px; }
        .reminder-banner.show { display: flex; }
        .banner-text { flex: 1; font-size: .875rem; color: #92400E; }
        .banner-actions { display: flex; gap: 8px; flex-shrink: 0; }

        /* 버튼 */
        .btn { padding: 8px 14px; border-radius: 8px; border: none; font-size: .85rem; font-weight: 500; cursor: pointer; transition: all .15s; white-space: nowrap; }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-h); }
        .btn-secondary { background: #fff; color: var(--text); border: 1px solid var(--border); }
        .btn-secondary:hover { background: #F8FAFC; }
        .btn-kakao { background: #FEE500; color: #3C1E1E; font-weight: 700; }
        .btn-kakao:hover { background: #FFD600; }
        .btn-danger { background: #FEE2E2; color: var(--red); }
        .btn-danger:hover { background: #FECACA; }
        .btn-sm { padding: 5px 10px; font-size: .8rem; }

        /* 탭 패널 */
        .tab-pane { display: none; flex: 1; flex-direction: column; }
        .tab-pane.active { display: flex; }

        /* ── 보드 탭 ── */
        .board-wrap { flex: 1; padding: 20px 24px; }
        .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
        @media (max-width: 760px) { .board { grid-template-columns: 1fr; } }
        .col { background: var(--card); border-radius: 14px; border: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
        .col-head { padding: 13px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
        .col-title { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: .9rem; }
        .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
        .dot-red { background: var(--red); } .dot-amber { background: var(--amber); } .dot-green { background: var(--green); }
        .col-count { background: #F1F5F9; color: var(--muted); padding: 2px 9px; border-radius: 20px; font-size: .78rem; font-weight: 700; }
        .col-body { padding: 12px; flex: 1; min-height: 160px; overflow-y: auto; max-height: 65vh; }
        .task-card { background: #F8FAFC; border: 1px solid var(--border); border-radius: 9px; padding: 11px 12px; margin-bottom: 8px; cursor: pointer; transition: border-color .2s, box-shadow .2s; }
        .task-card:last-child { margin-bottom: 0; }
        .task-card:hover { border-color: var(--primary); box-shadow: 0 2px 10px rgba(79,70,229,.1); }
        .task-card.is-done { opacity: .65; }
        .card-title { font-weight: 600; font-size: .88rem; margin-bottom: 3px; word-break: break-all; }
        .card-sub { font-size: .78rem; color: var(--muted); margin-bottom: 4px; word-break: break-all; }
        .card-expire { font-size: .72rem; color: #9CA3AF; margin-bottom: 5px; }
        .status-btns { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 6px; }
        .s-btn { padding: 3px 8px; border-radius: 5px; border: 1px solid var(--border); font-size: .75rem; cursor: pointer; background: #fff; transition: all .12s; }
        .s-btn:hover { background: #EFF6FF; border-color: var(--primary); color: var(--primary); }
        .card-date { font-size: .72rem; color: #CBD5E1; text-align: right; }
        .badge { padding: 3px 9px; border-radius: 20px; font-size: .75rem; font-weight: 600; white-space: nowrap; }
        .badge-red { background: #FEE2E2; color: #DC2626; }
        .badge-amber { background: #FEF3C7; color: #D97706; }
        .empty-state { text-align: center; padding: 32px 16px; color: var(--muted); }
        .empty-state .ei { font-size: 2rem; margin-bottom: 8px; }
        .empty-state p { font-size: .83rem; }

        /* ── 담당자별 탭 ── */
        .person-wrap { flex: 1; padding: 20px 24px; overflow-y: auto; }
        .person-add-row { display: flex; gap: 8px; margin-bottom: 20px; align-items: center; flex-wrap: wrap; }
        .person-add-row input { flex: 1; min-width: 160px; max-width: 260px; padding: 9px 13px; border: 1.5px solid var(--border); border-radius: 8px; font-size: .9rem; outline: none; transition: border-color .2s; font-family: inherit; }
        .person-add-row input:focus { border-color: var(--primary); }
        .person-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 16px; }
        .person-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
        .person-card-head { padding: 13px 16px; background: #F8FAFC; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
        .p-avatar-wrap { display: flex; align-items: center; gap: 10px; }
        .p-avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: .95rem; color: #fff; flex-shrink: 0; }
        .p-name { font-weight: 700; font-size: .95rem; }
        .p-sub { font-size: .75rem; color: var(--muted); }
        .p-remove { background: none; border: none; cursor: pointer; color: #CBD5E1; font-size: .9rem; padding: 4px; border-radius: 4px; transition: color .15s; }
        .p-remove:hover { color: var(--red); }
        .person-card-body { padding: 10px 12px; }
        .p-task-item { padding: 8px 10px; background: #F8FAFC; border: 1px solid var(--border); border-radius: 7px; margin-bottom: 6px; cursor: pointer; transition: border-color .15s; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
        .p-task-item:last-child { margin-bottom: 0; }
        .p-task-item:hover { border-color: var(--primary); }
        .p-task-title { font-size: .85rem; font-weight: 500; flex: 1; }
        .p-empty { text-align: center; padding: 20px 16px; color: var(--muted); font-size: .82rem; }

        /* ── 완료 캘린더 탭 ── */
        .cal-wrap { flex: 1; padding: 20px 24px; overflow-y: auto; }
        .cal-nav { display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 16px; }
        .cal-nav-btn { background: #fff; border: 1px solid var(--border); border-radius: 8px; width: 34px; height: 34px; cursor: pointer; font-size: 1.1rem; color: var(--text); transition: background .15s; }
        .cal-nav-btn:hover { background: #F1F5F9; }
        .cal-month { font-weight: 700; font-size: 1.05rem; }
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; max-width: 760px; margin: 0 auto; }
        .cal-dow { text-align: center; padding: 8px 4px; font-size: .75rem; font-weight: 600; color: var(--muted); }
        .cal-cell { background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 7px 6px; min-height: 70px; }
        .cal-cell.empty { background: transparent; border-color: transparent; }
        .cal-cell.is-today { border-color: var(--primary); background: #EEF2FF; }
        .cal-cell.has-done { background: #F0FDF4; border-color: var(--green); cursor: pointer; }
        .cal-cell.has-done:hover { background: #DCFCE7; box-shadow: 0 2px 8px rgba(16,185,129,.15); }
        .cal-day-num { font-size: .78rem; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
        .cal-cell.is-today .cal-day-num { color: var(--primary); }
        .cal-dots { display: flex; flex-direction: column; gap: 2px; }
        .cal-dot { background: #D1FAE5; color: #065F46; font-size: .68rem; padding: 2px 5px; border-radius: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }

        /* 설정 드롭다운 */
        .settings-menu { position: absolute; right: 24px; top: 56px; background: #fff; border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.12); overflow: hidden; z-index: 30; min-width: 150px; display: none; }
        .settings-menu.open { display: block; }
        .settings-menu button { width: 100%; padding: 11px 16px; text-align: left; background: none; border: none; font-size: .875rem; cursor: pointer; color: var(--text); }
        .settings-menu button:hover { background: #F8FAFC; }
        .settings-menu button.danger { color: var(--red); }

        /* ── 모달 ── */
        .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
        .overlay.show { display: flex; }
        .modal { background: #fff; border-radius: 16px; padding: 28px; width: 100%; max-width: 460px; max-height: 90vh; overflow-y: auto; box-shadow: 0 24px 64px rgba(0,0,0,.18); }
        .modal h2 { font-size: 1.1rem; font-weight: 700; margin-bottom: 20px; }
        .form-row { margin-bottom: 14px; }
        .form-row label { display: block; font-size: .83rem; font-weight: 600; margin-bottom: 5px; }
        .form-row input, .form-row textarea, .form-row select { width: 100%; padding: 10px 13px; border: 1.5px solid var(--border); border-radius: 8px; font-size: .9rem; outline: none; transition: border-color .2s; font-family: inherit; color: var(--text); background: #fff; }
        .form-row input:focus, .form-row textarea:focus, .form-row select:focus { border-color: var(--primary); }
        .form-row textarea { min-height: 70px; resize: vertical; }
        .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border); }
        .reminder-list { margin: 12px 0; }
        .reminder-item { padding: 10px 13px; background: #F8FAFC; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .ri-title { font-weight: 600; font-size: .875rem; }
        .ri-sub { font-size: .78rem; color: var(--muted); }

        /* Toast */
        .toast { position: fixed; bottom: 24px; right: 24px; background: #1E293B; color: #fff; padding: 11px 18px; border-radius: 9px; font-size: .85rem; z-index: 200; opacity: 0; transform: translateY(8px); transition: all .25s; pointer-events: none; }
        .toast.show { opacity: 1; transform: translateY(0); }
    </style>
</head>
<body>

<!-- 비밀번호 화면 -->
<div id="pw-screen">
    <div class="pw-card">
        <div class="logo">📋</div>
        <h2>팀 업무 리마인더</h2>
        <p>비밀번호를 입력하세요</p>
        <input type="password" id="pw-input" placeholder="비밀번호"
               onkeydown="if(event.key==='Enter')login()">
        <button class="pw-btn" onclick="login()">입장하기</button>
        <div class="pw-err" id="pw-err"></div>
    </div>
</div>

<!-- 메인 앱 -->
<div id="app">
    <div class="header">
        <div class="header-top">
            <div>
                <div class="header-title" id="site-title">팀 업무 리마인더</div>
                <div class="header-date" id="today-date"></div>
            </div>
            <div class="header-actions">
                <button class="btn btn-secondary btn-sm" onclick="openReminderModal()">📋 현황</button>
                <button class="btn btn-primary btn-sm" onclick="openAddTask()">+ 업무 추가</button>
                <button class="btn btn-secondary btn-sm" onclick="toggleSettings()">⚙</button>
            </div>
        </div>
        <div class="tabs">
            <button class="tab-btn active" data-tab="board" onclick="switchTab('board')">📋 보드</button>
            <button class="tab-btn" data-tab="person" onclick="switchTab('person')">👤 담당자별</button>
            <button class="tab-btn" data-tab="calendar" onclick="switchTab('calendar')">📅 완료 캘린더</button>
        </div>
    </div>

    <!-- 설정 드롭다운 -->
    <div class="settings-menu" id="settings-menu">
        <button onclick="openSettings()">🔧 설정 변경</button>
        <button onclick="logout()" class="danger">🔒 로그아웃</button>
    </div>

    <!-- 리마인더 배너 -->
    <div class="reminder-banner" id="reminder-banner">
        <span>⚠️</span>
        <div class="banner-text"><strong>미완료 업무 알림</strong><span id="banner-text"> — 어제부터 이어진 업무가 있습니다.</span></div>
        <div class="banner-actions">
            <button class="btn btn-kakao btn-sm" onclick="shareKakao()">카카오톡 공유</button>
            <button class="btn btn-secondary btn-sm" onclick="dismissBanner()">닫기</button>
        </div>
    </div>

    <!-- 탭: 보드 -->
    <div id="tab-board" class="tab-pane active">
        <div class="board-wrap">
            <div class="board">
                <div class="col">
                    <div class="col-head">
                        <div class="col-title"><span class="dot dot-red"></span>작업 시작 안함</div>
                        <span class="col-count" id="cnt-ns">0</span>
                    </div>
                    <div class="col-body" id="col-ns"></div>
                </div>
                <div class="col">
                    <div class="col-head">
                        <div class="col-title"><span class="dot dot-amber"></span>작업중</div>
                        <span class="col-count" id="cnt-ip">0</span>
                    </div>
                    <div class="col-body" id="col-ip"></div>
                </div>
                <div class="col">
                    <div class="col-head">
                        <div class="col-title"><span class="dot dot-green"></span>완료 (7일 후 삭제)</div>
                        <span class="col-count" id="cnt-dn">0</span>
                    </div>
                    <div class="col-body" id="col-dn"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 탭: 담당자별 -->
    <div id="tab-person" class="tab-pane">
        <div class="person-wrap" id="person-wrap"></div>
    </div>

    <!-- 탭: 완료 캘린더 -->
    <div id="tab-calendar" class="tab-pane">
        <div class="cal-wrap">
            <div class="cal-nav">
                <button class="cal-nav-btn" onclick="calMove(-1)">‹</button>
                <span class="cal-month" id="cal-month-label"></span>
                <button class="cal-nav-btn" onclick="calMove(1)">›</button>
            </div>
            <div class="cal-grid" id="cal-grid"></div>
        </div>
    </div>
</div>

<!-- 업무 추가/수정 모달 -->
<div class="overlay" id="task-overlay" onclick="if(event.target===this)closeTaskModal()">
    <div class="modal">
        <h2 id="task-modal-h">업무 추가</h2>
        <div class="form-row">
            <label>업무명 *</label>
            <input id="f-title" type="text" placeholder="업무 제목">
        </div>
        <div class="form-row">
            <label>설명 (선택)</label>
            <textarea id="f-desc" placeholder="상세 내용"></textarea>
        </div>
        <div class="form-row">
            <label>담당자 (선택)</label>
            <input id="f-assignee" type="text" list="assignee-list" placeholder="담당자 이름">
            <datalist id="assignee-list"></datalist>
        </div>
        <div class="form-row">
            <label>상태</label>
            <select id="f-status">
                <option value="작업 시작 안함">작업 시작 안함</option>
                <option value="작업중">작업중</option>
                <option value="완료">완료</option>
            </select>
        </div>
        <div class="modal-actions">
            <button class="btn btn-secondary" onclick="closeTaskModal()">취소</button>
            <button class="btn btn-danger btn-sm" id="del-btn" onclick="deleteEditing()" style="display:none">삭제</button>
            <button class="btn btn-primary" onclick="saveTask()">저장</button>
        </div>
    </div>
</div>

<!-- 현황 모달 -->
<div class="overlay" id="remind-overlay" onclick="if(event.target===this)closeReminderModal()">
    <div class="modal">
        <h2>📋 미완료 업무 현황</h2>
        <div class="reminder-list" id="remind-list"></div>
        <div class="modal-actions">
            <button class="btn btn-kakao" onclick="shareKakao()">📤 카카오톡 공유</button>
            <button class="btn btn-secondary" onclick="closeReminderModal()">닫기</button>
        </div>
    </div>
</div>

<!-- 캘린더 날짜 클릭 모달 -->
<div class="overlay" id="day-overlay" onclick="if(event.target===this)closeDayModal()">
    <div class="modal">
        <h2 id="day-modal-h">완료 업무</h2>
        <div class="reminder-list" id="day-modal-list"></div>
        <div class="modal-actions">
            <button class="btn btn-secondary" onclick="closeDayModal()">닫기</button>
        </div>
    </div>
</div>

<!-- 설정 모달 -->
<div class="overlay" id="cfg-overlay" onclick="if(event.target===this)closeCfgModal()">
    <div class="modal">
        <h2>⚙ 설정</h2>
        <div class="form-row">
            <label>사이트 제목</label>
            <input id="cfg-title" type="text" placeholder="팀 업무 리마인더">
        </div>
        <div class="form-row">
            <label>카카오 JavaScript 앱키 (선택)</label>
            <input id="cfg-kakao" type="text" placeholder="카카오 개발자 콘솔에서 발급">
        </div>
        <div class="modal-actions">
            <button class="btn btn-secondary" onclick="closeCfgModal()">취소</button>
            <button class="btn btn-primary" onclick="saveCfg()">저장</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ══════════════════════════════════════════════
//  비밀번호 — 소스코드에서만 관리 (localStorage 미사용)
// ══════════════════════════════════════════════
const SOURCE_PASSWORD = '9988';   // ← 비밀번호 변경 시 여기만 수정

// ══════════════════════════════════════════════
//  설정 (제목, 카카오키만 localStorage)
// ══════════════════════════════════════════════
function loadCFG() {
    const s = JSON.parse(localStorage.getItem('__cfg') || '{}');
    return { siteTitle: s.siteTitle || '팀 업무 리마인더', kakaoKey: s.kakaoKey || '' };
}
let CFG = loadCFG();

function saveCFGStorage() { localStorage.setItem('__cfg', JSON.stringify({ siteTitle: CFG.siteTitle, kakaoKey: CFG.kakaoKey })); }

// ══════════════════════════════════════════════
//  인증
// ══════════════════════════════════════════════
function login() {
    const val = document.getElementById('pw-input').value;
    if (val === SOURCE_PASSWORD) {
        sessionStorage.setItem('auth', '1');
        document.getElementById('pw-screen').style.display = 'none';
        document.getElementById('app').style.display = 'flex';
        bootApp();
    } else {
        document.getElementById('pw-err').textContent = '비밀번호가 올바르지 않습니다.';
        document.getElementById('pw-input').value = '';
    }
}
function logout() { sessionStorage.removeItem('auth'); location.reload(); }

// ══════════════════════════════════════════════
//  앱 부팅
// ══════════════════════════════════════════════
let tasks = [];
let members = [];

function bootApp() {
    CFG = loadCFG();
    document.title = CFG.siteTitle;
    document.getElementById('site-title').textContent = CFG.siteTitle;
    const now = new Date();
    const days = ['일','월','화','수','목','금','토'];
    document.getElementById('today-date').textContent =
        `${now.getFullYear()}년 ${now.getMonth()+1}월 ${now.getDate()}일 (${days[now.getDay()]})`;
    loadData();
    initKakao();
    checkDailyReminder();
}

function loadData() {
    tasks   = JSON.parse(localStorage.getItem('tasks')   || '[]');
    members = JSON.parse(localStorage.getItem('members') || '[]');
    pruneOldDone();
    renderBoard();
    updateAssigneeList();
}
function saveTasks()   { localStorage.setItem('tasks',   JSON.stringify(tasks));   }
function saveMembers() { localStorage.setItem('members', JSON.stringify(members)); updateAssigneeList(); }

function pruneOldDone() {
    const cut = Date.now() - 7 * 86400000;
    const before = tasks.length;
    tasks = tasks.filter(t => !(t.status === '완료' && t.doneAt && t.doneAt < cut));
    if (tasks.length !== before) saveTasks();
}

function initKakao() {
    if (CFG.kakaoKey && window.Kakao && !Kakao.isInitialized()) Kakao.init(CFG.kakaoKey);
}

function updateAssigneeList() {
    const dl = document.getElementById('assignee-list');
    if (dl) dl.innerHTML = members.map(m => `<option value="${esc(m)}">`).join('');
}

// ══════════════════════════════════════════════
//  탭 전환
// ══════════════════════════════════════════════
let activeTab = 'board';
function switchTab(name) {
    activeTab = name;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
    document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
    document.getElementById(`tab-${name}`).classList.add('active');
    if (name === 'person')   renderPersonTab();
    if (name === 'calendar') renderCalendar();
}

// ══════════════════════════════════════════════
//  보드 렌더링
// ══════════════════════════════════════════════
function renderBoard() {
    renderCol('작업 시작 안함', 'col-ns', 'cnt-ns');
    renderCol('작업중',         'col-ip', 'cnt-ip');
    renderCol('완료',           'col-dn', 'cnt-dn');
    if (activeTab === 'person')   renderPersonTab();
    if (activeTab === 'calendar') renderCalendar();
}

function renderCol(status, colId, cntId) {
    const list = tasks.filter(t => t.status === status);
    document.getElementById(cntId).textContent = list.length;
    const el = document.getElementById(colId);
    if (!list.length) {
        el.innerHTML = `<div class="empty-state"><div class="ei">${status==='완료'?'✅':'📝'}</div><p>업무 없음</p></div>`;
        return;
    }
    el.innerHTML = list.map(taskCard).join('');
}

function taskCard(t) {
    const d = new Date(t.createdAt);
    const dateStr = `${d.getMonth()+1}/${d.getDate()}`;
    let expire = '';
    if (t.status === '완료' && t.doneAt) {
        const dl = 7 - Math.floor((Date.now() - t.doneAt) / 86400000);
        if (dl <= 3) expire = `<div class="card-expire">⏱ ${dl}일 후 자동 삭제</div>`;
    }
    const btnMap = {
        '작업 시작 안함': [['작업중','▶ 시작'],['완료','✓ 완료']],
        '작업중':         [['완료','✓ 완료'],['작업 시작 안함','← 되돌리기']],
        '완료':           [['작업중','↩ 재개'],['작업 시작 안함','처음으로']],
    };
    const btns = (btnMap[t.status]||[]).map(([s,l]) =>
        `<button class="s-btn" onclick="event.stopPropagation();quickStatus('${t.id}','${s}')">${l}</button>`
    ).join('');
    return `<div class="task-card${t.status==='완료'?' is-done':''}" onclick="openEdit('${t.id}')">
        <div class="card-title">${esc(t.title)}</div>
        ${t.desc ? `<div class="card-sub">${esc(t.desc)}</div>` : ''}
        ${t.assignee ? `<div class="card-sub">👤 ${esc(t.assignee)}</div>` : ''}
        ${expire}
        <div class="status-btns">${btns}</div>
        <div class="card-date">${dateStr}</div>
    </div>`;
}

function quickStatus(id, s) {
    const t = tasks.find(x => x.id === id);
    if (!t) return;
    t.status = s;
    t.doneAt = s === '완료' ? Date.now() : null;
    saveTasks(); renderBoard(); showToast(`상태 변경: ${s}`);
}

// ══════════════════════════════════════════════
//  담당자별 탭
// ══════════════════════════════════════════════
function renderPersonTab() {
    const wrap = document.getElementById('person-wrap');
    const incomplete = tasks.filter(t => t.status !== '완료');
    const avatarColors = ['#4F46E5','#0EA5E9','#10B981','#F59E0B','#EF4444','#8B5CF6','#EC4899','#F97316'];

    let html = `<div class="person-add-row">
        <input id="new-member-input" type="text" placeholder="팀원 이름 입력"
               onkeydown="if(event.key==='Enter')addMember()">
        <button class="btn btn-primary btn-sm" onclick="addMember()">+ 인원 추가</button>
    </div><div class="person-grid">`;

    if (!members.length) {
        html += `<div style="grid-column:1/-1;text-align:center;padding:48px;color:var(--muted)">
            <div style="font-size:2rem;margin-bottom:8px">👥</div>
            <p>인원을 추가하면 담당자별 업무 현황을 볼 수 있습니다</p>
        </div>`;
    } else {
        members.forEach(m => {
            const mt = incomplete.filter(t => t.assignee === m);
            const col = avatarColors[m.charCodeAt(0) % avatarColors.length];
            html += `<div class="person-card">
                <div class="person-card-head">
                    <div class="p-avatar-wrap">
                        <div class="p-avatar" style="background:${col}">${m.charAt(0)}</div>
                        <div>
                            <div class="p-name">${esc(m)}</div>
                            <div class="p-sub">${mt.length}건 진행중</div>
                        </div>
                    </div>
                    <button class="p-remove" onclick="removeMember('${esc(m)}')" title="제거">✕</button>
                </div>
                <div class="person-card-body">
                    ${mt.length ? mt.map(t => `
                        <div class="p-task-item" onclick="openEdit('${t.id}')">
                            <span class="p-task-title">${esc(t.title)}</span>
                            <span class="badge ${t.status==='작업중'?'badge-amber':'badge-red'}">${t.status}</span>
                        </div>`).join('')
                    : `<div class="p-empty">✅ 진행중인 업무 없음</div>`}
                </div>
            </div>`;
        });
    }
    html += '</div>';
    wrap.innerHTML = html;
}

function addMember() {
    const input = document.getElementById('new-member-input');
    const name = input.value.trim();
    if (!name) { showToast('이름을 입력하세요.'); return; }
    if (members.includes(name)) { showToast('이미 등록된 인원입니다.'); return; }
    members.push(name);
    saveMembers(); renderPersonTab();
    input.value = ''; showToast(`${name} 추가됨`);
}

function removeMember(name) {
    if (!confirm(`'${name}'을 인원에서 제거하시겠습니까?`)) return;
    members = members.filter(m => m !== name);
    saveMembers(); renderPersonTab(); showToast(`${name} 제거됨`);
}

// ══════════════════════════════════════════════
//  완료 캘린더
// ══════════════════════════════════════════════
let calYear = new Date().getFullYear();
let calMonth = new Date().getMonth();

function calMove(dir) {
    calMonth += dir;
    if (calMonth < 0)  { calMonth = 11; calYear--; }
    if (calMonth > 11) { calMonth = 0;  calYear++; }
    renderCalendar();
}

function renderCalendar() {
    const months = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
    document.getElementById('cal-month-label').textContent = `${calYear}년 ${months[calMonth]}`;

    const firstDow  = new Date(calYear, calMonth, 1).getDay();   // 0=Sun
    const offset    = (firstDow + 6) % 7;                        // Monday-start
    const daysInMon = new Date(calYear, calMonth + 1, 0).getDate();
    const today     = new Date();

    const byDay = {};
    tasks.forEach(t => {
        if (t.status !== '완료' || !t.doneAt) return;
        const d = new Date(t.doneAt);
        if (d.getFullYear() !== calYear || d.getMonth() !== calMonth) return;
        const day = d.getDate();
        if (!byDay[day]) byDay[day] = [];
        byDay[day].push(t);
    });

    const dows = ['월','화','수','목','금','토','일'];
    let html = dows.map((d,i) => `<div class="cal-dow" style="${i>=5?'color:var(--red)':''}">${d}</div>`).join('');

    for (let i = 0; i < offset; i++) html += '<div class="cal-cell empty"></div>';

    for (let d = 1; d <= daysInMon; d++) {
        const isToday = today.getFullYear()===calYear && today.getMonth()===calMonth && today.getDate()===d;
        const dayTasks = byDay[d] || [];
        const hasDone  = dayTasks.length > 0;
        const dow      = (offset + d - 1) % 7;
        const isWeekend = dow >= 5;

        html += `<div class="cal-cell${isToday?' is-today':''}${hasDone?' has-done':''}"
            ${hasDone ? `onclick="showDayModal(${d})"` : ''}>
            <div class="cal-day-num" style="${isWeekend?'color:var(--red)':''}">${d}</div>
            ${hasDone ? `<div class="cal-dots">
                ${dayTasks.slice(0,3).map(t=>`<div class="cal-dot">${esc(t.title)}</div>`).join('')}
                ${dayTasks.length>3 ? `<div class="cal-dot">+${dayTasks.length-3}건 더</div>` : ''}
            </div>` : ''}
        </div>`;
    }

    document.getElementById('cal-grid').innerHTML = html;
}

function showDayModal(day) {
    const months = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
    const dayTasks = tasks.filter(t => {
        if (t.status !== '완료' || !t.doneAt) return false;
        const d = new Date(t.doneAt);
        return d.getFullYear()===calYear && d.getMonth()===calMonth && d.getDate()===day;
    });
    document.getElementById('day-modal-h').textContent = `${months[calMonth]} ${day}일 완료 업무 (${dayTasks.length}건)`;
    document.getElementById('day-modal-list').innerHTML = dayTasks.map(t => `
        <div class="reminder-item">
            <div>
                <div class="ri-title">${esc(t.title)}</div>
                ${t.assignee ? `<div class="ri-sub">👤 ${esc(t.assignee)}</div>` : ''}
            </div>
            <span class="badge" style="background:#D1FAE5;color:#065F46">✓ 완료</span>
        </div>`).join('');
    document.getElementById('day-overlay').classList.add('show');
}
function closeDayModal() { document.getElementById('day-overlay').classList.remove('show'); }

// ══════════════════════════════════════════════
//  일별 리마인더 배너
// ══════════════════════════════════════════════
function checkDailyReminder() {
    const today = new Date().toDateString();
    const lastVisit = localStorage.getItem('last_visit');
    const dismissed = localStorage.getItem('banner_dismissed');
    localStorage.setItem('last_visit', today);
    if (dismissed === today) return;
    if (!lastVisit || lastVisit === today) return;
    const incomplete = tasks.filter(t => t.status !== '완료');
    if (!incomplete.length) return;
    const ns = incomplete.filter(t => t.status === '작업 시작 안함').length;
    const ip = incomplete.filter(t => t.status === '작업중').length;
    let parts = [];
    if (ip) parts.push(`작업중 ${ip}건`);
    if (ns) parts.push(`미시작 ${ns}건`);
    document.getElementById('banner-text').textContent = ` — ${parts.join(' | ')}`;
    document.getElementById('reminder-banner').classList.add('show');
}
function dismissBanner() {
    document.getElementById('reminder-banner').classList.remove('show');
    localStorage.setItem('banner_dismissed', new Date().toDateString());
}

// ══════════════════════════════════════════════
//  현황 모달
// ══════════════════════════════════════════════
function openReminderModal() {
    const list = tasks.filter(t => t.status !== '완료');
    const el = document.getElementById('remind-list');
    el.innerHTML = list.length ? list.map(t => `
        <div class="reminder-item">
            <div>
                <div class="ri-title">${esc(t.title)}</div>
                ${t.assignee ? `<div class="ri-sub">👤 ${esc(t.assignee)}</div>` : ''}
            </div>
            <span class="badge ${t.status==='작업중'?'badge-amber':'badge-red'}">${t.status}</span>
        </div>`).join('')
    : `<div class="empty-state"><div class="ei">🎉</div><p>모든 업무가 완료되었습니다!</p></div>`;
    document.getElementById('remind-overlay').classList.add('show');
}
function closeReminderModal() { document.getElementById('remind-overlay').classList.remove('show'); }

// ══════════════════════════════════════════════
//  카카오톡 공유
// ══════════════════════════════════════════════
function shareKakao() {
    const list = tasks.filter(t => t.status !== '완료');
    const text = buildShareText(list);
    if (window.Kakao && Kakao.isInitialized()) {
        Kakao.Share.sendDefault({ objectType: 'text', text, link: { mobileWebUrl: location.href, webUrl: location.href } });
    } else {
        navigator.clipboard.writeText(text)
            .then(() => showToast('📋 클립보드에 복사됨! 카카오톡에 붙여넣기 하세요.', 4000))
            .catch(() => alert(text));
    }
}
function buildShareText(list) {
    const d = new Date();
    let msg = `📋 [팀 업무 리마인더] ${d.getMonth()+1}월 ${d.getDate()}일\n\n`;
    const ip = list.filter(t => t.status === '작업중');
    const ns = list.filter(t => t.status === '작업 시작 안함');
    if (ip.length) { msg += `🔶 작업중 (${ip.length}건)\n`; ip.forEach(t => { msg += `  • ${t.title}${t.assignee?` (${t.assignee})`:''}\n`; }); msg += '\n'; }
    if (ns.length) { msg += `🔴 미시작 (${ns.length}건)\n`; ns.forEach(t => { msg += `  • ${t.title}${t.assignee?` (${t.assignee})`:''}\n`; }); }
    if (!ip.length && !ns.length) msg += '✅ 미완료 업무 없음';
    return msg.trim();
}

// ══════════════════════════════════════════════
//  업무 모달
// ══════════════════════════════════════════════
let editId = null;
function openAddTask() {
    editId = null;
    document.getElementById('task-modal-h').textContent = '업무 추가';
    document.getElementById('f-title').value = '';
    document.getElementById('f-desc').value = '';
    document.getElementById('f-assignee').value = '';
    document.getElementById('f-status').value = '작업 시작 안함';
    document.getElementById('del-btn').style.display = 'none';
    document.getElementById('task-overlay').classList.add('show');
    document.getElementById('f-title').focus();
}
function openEdit(id) {
    const t = tasks.find(x => x.id === id);
    if (!t) return;
    editId = id;
    document.getElementById('task-modal-h').textContent = '업무 수정';
    document.getElementById('f-title').value = t.title;
    document.getElementById('f-desc').value = t.desc || '';
    document.getElementById('f-assignee').value = t.assignee || '';
    document.getElementById('f-status').value = t.status;
    document.getElementById('del-btn').style.display = 'inline-block';
    document.getElementById('task-overlay').classList.add('show');
    document.getElementById('f-title').focus();
}
function closeTaskModal() { document.getElementById('task-overlay').classList.remove('show'); editId = null; }

function saveTask() {
    const title = document.getElementById('f-title').value.trim();
    if (!title) { showToast('업무명을 입력하세요.'); document.getElementById('f-title').focus(); return; }
    const status   = document.getElementById('f-status').value;
    const desc     = document.getElementById('f-desc').value.trim();
    const assignee = document.getElementById('f-assignee').value.trim();
    if (editId) {
        const t = tasks.find(x => x.id === editId);
        if (t) {
            if (t.status !== '완료' && status === '완료') t.doneAt = Date.now();
            if (t.status === '완료' && status !== '완료') t.doneAt = null;
            Object.assign(t, { title, desc, assignee, status });
        }
        showToast('업무가 수정되었습니다.');
    } else {
        tasks.unshift({ id: Date.now().toString(36)+Math.random().toString(36).slice(2,5), title, desc, assignee, status, createdAt: Date.now(), doneAt: status==='완료'?Date.now():null });
        showToast('업무가 추가되었습니다.');
    }
    saveTasks(); renderBoard(); closeTaskModal();
}

function deleteEditing() {
    if (!editId || !confirm('이 업무를 삭제하시겠습니까?')) return;
    tasks = tasks.filter(t => t.id !== editId);
    saveTasks(); renderBoard(); showToast('삭제되었습니다.'); closeTaskModal();
}

// ══════════════════════════════════════════════
//  설정 모달
// ══════════════════════════════════════════════
function toggleSettings() {
    const m = document.getElementById('settings-menu');
    m.classList.toggle('open');
    if (m.classList.contains('open')) setTimeout(() => document.addEventListener('click', closeSettingsMenu), 0);
}
function closeSettingsMenu(e) {
    const m = document.getElementById('settings-menu');
    if (!m.contains(e.target)) { m.classList.remove('open'); document.removeEventListener('click', closeSettingsMenu); }
}
function openSettings() {
    document.getElementById('settings-menu').classList.remove('open');
    document.getElementById('cfg-title').value = CFG.siteTitle;
    document.getElementById('cfg-kakao').value = CFG.kakaoKey;
    document.getElementById('cfg-overlay').classList.add('show');
}
function closeCfgModal() { document.getElementById('cfg-overlay').classList.remove('show'); }
function saveCfg() {
    CFG.siteTitle = document.getElementById('cfg-title').value.trim() || CFG.siteTitle;
    CFG.kakaoKey  = document.getElementById('cfg-kakao').value.trim();
    saveCFGStorage();
    document.title = CFG.siteTitle;
    document.getElementById('site-title').textContent = CFG.siteTitle;
    initKakao(); closeCfgModal(); showToast('설정이 저장되었습니다.');
}

// ══════════════════════════════════════════════
//  유틸
// ══════════════════════════════════════════════
function esc(s) { const d = document.createElement('div'); d.textContent = s||''; return d.innerHTML; }
let _tt;
function showToast(msg, ms=2500) {
    const el = document.getElementById('toast');
    el.textContent = msg; el.classList.add('show');
    clearTimeout(_tt); _tt = setTimeout(() => el.classList.remove('show'), ms);
}

        document.getElementById('pw-screen').style.display = 'none';

        document.getElementById('pw-input').focus();
